<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료구조 시뮬레이터 · 연결 리스트 / 트리 / 그래프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0" rel="stylesheet">
<style>
  /* 아티팩트로 게시할 때는 <head>의 <link> 태그 없이 <style> 블록만 그대로 옮겨지므로,
     폰트를 @import로도 함께 불러와 게시된 페이지에서도 아이콘·서체가 제대로 보이게 합니다. */
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0');
  :root{
    --bg:#EEF1F6;
    --surface:#FFFFFF;
    --surface-2:#F5F7FB;
    --ink:#14181F;
    --ink-soft:#4A5468;
    --ink-faint:#7C8698;
    --line:#D8DEE9;
    --ref:#0F7A73;
    --ref-soft:#E2F3F1;
    --mutable:#B5502E;
    --mutable-soft:#F8E9E2;
    --immutable:#2F4B7C;
    --immutable-soft:#E8EDF6;
    --gold:#C9962B;
    --gold-soft:#FBF1DE;
    --navy-deep:#0A1F3A;
    --navy-mid:#122C50;
    --navy-line:rgba(255,255,255,.12);
    --on-navy:#F4F7FC;
    --on-navy-soft:#9FB0CC;
    --radius:16px;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'JetBrains Mono', monospace;
    --shadow: 0 1px 2px rgba(20,24,31,0.04), 0 8px 24px -12px rgba(20,24,31,0.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; height:100%;}
  body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    overflow-x:hidden;
    background-color:#F7F9FC;
    background-image:
      linear-gradient(rgba(47,75,124,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47,75,124,0.045) 1px, transparent 1px);
    background-size:42px 42px;
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:var(--serif); margin:0 0 .3em; color:var(--ink); font-weight:600; }
  code{ font-family:var(--mono); background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:.1em .35em; font-size:.92em; }
  button{ font-family:var(--sans); cursor:pointer; }
  input, select{ font-family:var(--sans); }
  ::selection{ background:var(--gold-soft); color:var(--ink); }

  /* ---------- Header (application chrome) ---------- */
  header.app-header{
    display:flex; align-items:center; gap:22px; flex-shrink:0;
    padding:14px 26px; background:linear-gradient(180deg, var(--navy-deep), #0D2545);
    position:relative; z-index:50;
    box-shadow:0 2px 10px rgba(4,12,26,.25);
  }
  .brand{ display:flex; align-items:center; flex-shrink:0; }
  .brand-logo{ height:46px; width:auto; display:block; }
  .header-titles{ flex:1; min-width:0; padding-left:18px; border-left:1px solid var(--navy-line); }
  .header-titles h1{ font-size:21px; margin:0; color:var(--on-navy); font-weight:700; white-space:nowrap; }
  .header-titles .eyebrow{ display:block; margin-top:3px; font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; color:var(--gold); text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .header-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .mode-badge{ font-family:var(--mono); font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--navy-deep); background:var(--gold); padding:6px 14px; border-radius:20px; white-space:nowrap; }

  /* ---------- Mode tabs (연결 리스트 / 트리 / 그래프 — 각진 토글 버튼 그룹, 가운데 정렬) ---------- */
  nav.mode-tabs{
    display:flex; justify-content:center; align-items:center; gap:0; padding:7px 24px;
    background:var(--navy-mid); border-bottom:1px solid var(--navy-line); flex-shrink:0;
  }
  .mode-tab{
    font-family:var(--sans); font-size:12px; letter-spacing:normal; font-weight:500;
    color:var(--on-navy-soft); background:rgba(255,255,255,.04);
    border:1px solid currentColor; border-radius:0;
    padding:7px 12px; margin-left:-1px; position:relative;
    transition:.18s ease; display:flex; align-items:center; gap:6px;
  }
  .mode-tab:first-child{ margin-left:0; }
  .mode-tab .gicon{ font-size:16px; opacity:.65; transition:.18s ease; margin-right:0; }
  .mode-tab:not(.active):hover{ color:var(--on-navy); background:rgba(255,255,255,.09); z-index:1; }
  .mode-tab:not(.active):hover .gicon{ opacity:.9; }
  .mode-tab.active{
    color:var(--gold); background:rgba(201,150,43,.12); z-index:2;
  }
  .mode-tab.active .gicon{ opacity:1; }

  /* ---------- Toolbar block (top menu에 고정되는 별도 도구모음 블록) ---------- */
  .toolbar-block{
    flex-shrink:0; position:relative; z-index:40;
    box-shadow:0 2px 6px rgba(10,20,40,.08);
  }
  .tbar-select, .tbar-input{
    font-size:12px; padding:6px 9px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink);
  }
  .tbar-input{ width:84px; }
  .tbar-input.narrow{ width:60px; }
  .tbar-check{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft); white-space:nowrap; padding:0 4px; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:2px; padding:8px 10px; border-bottom:1px solid var(--line); background:#EEF1F7; align-items:center; }
  .toolbar .grp{ display:flex; gap:4px; padding:0 10px; border-right:1px solid var(--line); flex-wrap:wrap; }
  .toolbar .grp:last-child{ border-right:none; }
  .tbtn{
    font-size:12px; padding:7px 12px; border-radius:8px; border:1px solid transparent;
    background:transparent; color:var(--ink-soft); transition:.12s; font-weight:500;
  }
  .tbtn:hover{ border-color:var(--line); background:var(--surface); color:var(--immutable); box-shadow:0 1px 2px rgba(20,24,31,.06); }
  .tbtn.active{ background:var(--immutable); border-color:var(--immutable); color:#fff; }
  .tbtn.accent{ background:var(--gold); border-color:var(--gold); color:#fff; }
  .tbtn.accent:hover{ color:#fff; opacity:.9; }
  .tbtn.danger:hover{ border-color:var(--mutable); color:var(--mutable); }
  .tbtn:disabled{ opacity:.4; cursor:not-allowed; }
  /* 구글 머티리얼 아이콘(이모지 대체용). 버튼/모달 등 텍스트 옆에 함께 쓰입니다. */
  .gicon{
    font-family:'Material Symbols Outlined';
    font-weight:normal; font-style:normal; font-size:16px; line-height:1;
    letter-spacing:normal; text-transform:none; display:inline-block; white-space:nowrap;
    word-wrap:normal; direction:ltr; -webkit-font-smoothing:antialiased;
    vertical-align:-3px; margin-right:2px;
  }
  .mode-tab .gicon, h3 .gicon{ vertical-align:-4px; }
  .toolbar-hint{ padding:6px 14px; font-size:11.5px; color:var(--ink-faint); border-bottom:1px solid var(--line); background:var(--surface); }

  /* ---------- Layout (헤더/도구모음~풋터 사이 전체를 격자 캔버스가 가득 채움, 여백 없음) ---------- */
  main.workspace{
    flex:1; min-height:0; display:flex; flex-direction:row; width:100%;
  }
  .workspace-panel{
    flex:1; min-height:0; display:flex; flex-direction:column;
  }
  /* 오른쪽 패널 — 재생·진행 기록 / 도움말 두 탭을 캔버스 오른쪽에 항상 고정 표시합니다(모달 아님). */
  .side-panel{
    width:340px; flex-shrink:0; min-height:0; display:flex; flex-direction:column;
    border-left:1px solid var(--line); background:var(--surface);
  }
  .side-panel-tabs{ flex-shrink:0; display:flex; border-bottom:1px solid var(--line); }
  .spt-tab{
    flex:1; display:flex; align-items:center; justify-content:center; gap:4px;
    padding:12px 8px; font-family:var(--sans); font-size:12.5px; font-weight:600;
    color:var(--ink-faint); background:var(--surface-2); border:none; cursor:pointer;
    border-bottom:2px solid transparent; transition:.12s;
  }
  .spt-tab:hover:not(.active){ color:var(--ink); }
  .spt-tab.active{ color:var(--immutable); background:var(--surface); border-bottom-color:var(--immutable); }
  .side-panel-body{ flex:1; min-height:0; display:none; flex-direction:column; }
  .side-panel-body.active{ display:flex; }
  #tabHelp.active{ overflow-y:auto; padding:14px 16px; }
  .side-panel .playback-controls{
    flex-shrink:0; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:12px 16px; border-bottom:1px solid var(--line);
  }
  .side-panel .playback-controls #seekBar{ flex-basis:100%; }
  .side-panel .history-list{ flex:1; min-height:0; overflow-y:auto; padding:10px 12px; max-height:none; }
  .help-panel-content h4{ font-size:13px; margin:16px 0 6px; color:var(--ink); display:flex; align-items:center; gap:4px; }
  .help-panel-content h4:first-child{ margin-top:0; }
  .help-panel-content .concept-svg{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:8px; margin-bottom:8px; }
  .helpbox ol, .helpbox ul{ margin:4px 0 4px 18px; padding:0; }
  .helpbox li{ margin-bottom:4px; }
  /* 도움말 패널의 "사용 방법" 목록은 helpbox 밖에 있어도 다른 영역과 같은 글자 크기를 쓰도록 맞춥니다. */
  .help-panel-content ol, .help-panel-content ul{
    margin:4px 0 4px 18px; padding:0; font-size:12.5px; color:var(--ink-soft); line-height:1.6;
  }
  .help-panel-content li{ margin-bottom:4px; }
  .help-panel-content li b{ color:var(--ink); }
  @media (max-width: 900px){
    main.workspace{ flex-direction:column; }
    .side-panel{ width:100%; max-height:360px; border-left:none; border-top:1px solid var(--line); }
  }
  .variant-row label.opt{ font-size:13px; color:var(--ink-soft); display:flex; align-items:center; gap:5px; }

  .canvas-card{
    flex:1; min-height:0; display:flex; flex-direction:column;
  }

  .svg-wrap{ flex:1; min-height:0; overflow:auto; position:relative; background:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:24px 24px; background-color:#FCFDFF;
  }
  svg.stage{ width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  svg.stage.panning{ cursor:grabbing; }
  .stage-hint{ position:absolute; left:14px; bottom:10px; font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); background:rgba(255,255,255,.85); padding:4px 9px; border-radius:8px; pointer-events:none; }

  .playbar{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--line); background:var(--surface); flex-wrap:wrap; }
  .playbar input[type=range]{ flex:1; min-width:120px; accent-color:var(--immutable); }
  .step-count{ font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); white-space:nowrap; }

  .narration-bar{ flex-shrink:0; padding:10px 14px; background:var(--gold-soft); border-top:1px solid var(--line); font-size:13.5px; color:var(--ink); min-height:20px; }

  /* side panel */
  .side-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:16px; margin-bottom:16px; }
  .side-card h3{ font-size:14px; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .side-card h3 .tag{ font-family:var(--mono); font-size:10px; letter-spacing:.05em; text-transform:uppercase; background:var(--ref-soft); color:var(--ref); padding:2px 7px; border-radius:20px; }
  .form-row{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .form-row input[type=text], .form-row input[type=number], .form-row select{
    flex:1; min-width:60px; padding:7px 9px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:var(--surface-2);
  }
  .op-btn{ width:100%; text-align:left; font-size:13px; padding:8px 11px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); margin-bottom:6px; transition:.12s; }
  .op-btn:hover{ border-color:var(--immutable); color:var(--immutable); background:var(--immutable-soft); }
  .op-btn .op-code{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); float:right; }

  .history-list{ max-height:220px; overflow-y:auto; font-size:12.5px; }
  .history-item{ padding:6px 8px; border-radius:7px; margin-bottom:3px; cursor:pointer; color:var(--ink-soft); border:1px solid transparent; }
  .history-item:hover{ background:var(--surface-2); }
  .history-item.current{ background:var(--immutable-soft); color:var(--immutable); font-weight:600; border-color:var(--immutable); }
  .history-item .seq{ font-family:var(--mono); color:var(--ink-faint); margin-right:6px; }
  .history-empty{ color:var(--ink-faint); font-size:12.5px; padding:8px 2px; }

  .filebtn{ display:inline-block; }
  .filebtn input{ display:none; }

  .adj-panel{ font-family:var(--mono); font-size:12px; white-space:pre; overflow-x:auto; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:10px; max-height:160px; overflow-y:auto; }

  .helpbox{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  .helpbox b{ color:var(--ink); }

  .legend{ flex-shrink:0; display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-soft); padding:8px 14px; border-top:1px dashed var(--line); }
  .legend .sw{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }

  footer.app-footer{
    flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
    padding:16px 26px; background:var(--navy-deep); color:var(--on-navy-soft); font-size:12px;
  }
  .footer-meta{ display:flex; gap:28px; flex-wrap:wrap; }
  .footer-meta .meta-item{ display:flex; flex-direction:column; gap:2px; }
  .footer-meta .meta-label{ font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:var(--on-navy-soft); opacity:.7; text-transform:uppercase; }
  .footer-meta .meta-value{ font-family:var(--mono); font-size:12px; color:var(--on-navy); font-weight:600; }
  .footer-creator{ font-family:var(--mono); font-size:11px; color:var(--on-navy-soft); text-align:right; }

  .toast{ position:fixed; right:20px; bottom:20px; background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none; z-index:200; }
  .toast.show{ opacity:1; transform:translateY(0); }

  /* ---------- Modal dialog ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,20,40,.42); display:flex; align-items:center; justify-content:center;
    z-index:300; opacity:0; pointer-events:none; transition:.15s;
  }
  .modal-backdrop.show{ opacity:1; pointer-events:auto; }
  .modal-box{
    background:var(--surface); border-radius:16px; width:360px; max-width:92vw; box-shadow:0 20px 60px -12px rgba(10,20,40,.4);
    transform:translateY(10px) scale(.98); transition:.15s; overflow:hidden; max-height:86vh; display:flex; flex-direction:column;
  }
  .modal-box.wide{ width:640px; }
  .modal-body{ overflow-y:auto; }
  .playback-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .playback-controls input[type=range]{ flex:1; min-width:120px; accent-color:var(--immutable); }
  .step-count{ font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); white-space:nowrap; }
  .modal-backdrop.show .modal-box{ transform:translateY(0) scale(1); }
  .modal-head{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); }
  .modal-head h3{ font-size:15px; margin:0; }
  .modal-close{ border:none; background:none; font-size:16px; color:var(--ink-faint); padding:2px 6px; border-radius:6px; }
  .modal-close:hover{ background:var(--line); color:var(--ink); }
  .modal-body{ padding:18px 20px; flex:1; min-height:0; }
  .modal-body .form-row{ margin-bottom:10px; }
  .modal-body .form-row:last-child{ margin-bottom:0; }
  .modal-foot{ padding:14px 20px; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; border-top:1px solid var(--line); background:var(--surface-2); }
  .modal-foot .tbtn{ border:1px solid var(--line); padding:8px 16px; }
  .modal-foot .tbtn.primary{ background:var(--immutable); border-color:var(--immutable); color:#fff; }
  .modal-foot .tbtn.primary:hover{ opacity:.9; color:#fff; }
  .modal-foot .tbtn.danger{ background:var(--mutable); border-color:var(--mutable); color:#fff; }
  .modal-foot .tbtn.danger:hover{ opacity:.9; color:#fff; }

  /* SVG element styles */
  .node-rect, .node-circle{ fill:var(--surface); stroke:var(--immutable); stroke-width:2; }
  .node-rect.head, .node-circle.head{ stroke:var(--ref); }
  .node-rect.highlight, .node-circle.highlight{ stroke:var(--gold); stroke-width:3; fill:var(--gold-soft); }
  .node-rect.visited, .node-circle.visited{ fill:var(--ref-soft); stroke:var(--ref); }
  .node-rect.compare, .node-circle.compare{ stroke:var(--mutable); fill:var(--mutable-soft); }
  .node-label{ font-family:var(--mono); font-size:13px; fill:var(--ink); text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
  /* next/prev 칸의 포인터 표시(●/∅)는 값 글자보다 눈에 잘 띄도록 더 크고 굵게 표시합니다. */
  .ptr-dot{ font-family:var(--mono); font-size:24px; font-weight:700; fill:var(--ink); text-anchor:middle; dominant-baseline:middle; pointer-events:none; }
  .node-sublabel{ font-family:var(--mono); font-size:9.5px; fill:var(--ink-faint); text-anchor:middle; pointer-events:none; }
  .edge-line{ stroke:var(--ink-soft); stroke-width:1.8; fill:none; }
  .edge-line.highlight{ stroke:var(--gold); stroke-width:3; }
  .edge-line.selected{ stroke:#2F4B7C; stroke-width:3.2; }
  .edge-line.tree-edge{ stroke:var(--immutable-soft); stroke-width:2; }
  .edge-label{ font-family:var(--mono); font-size:10.5px; fill:var(--ink-soft); }
  .null-box{ fill:var(--surface); stroke:var(--ink-faint); stroke-width:1.5; }
  .ghost{ opacity:.35; }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <img class="brand-logo" id="brandLogo" alt="대구과학고등학교 CI">
  </div>
  <div class="header-titles">
    <h1>자료구조 시뮬레이터</h1>
    <span class="eyebrow" id="headerEyebrow">DATA STRUCTURE SIMULATION TOOL</span>
  </div>
  <div class="header-right">
    <span class="mode-badge" id="modeBadge">LINKED LIST</span>
  </div>
</header>

<nav class="mode-tabs" id="modeTabs"></nav>

<div class="toolbar-block">
  <div class="toolbar" id="toolbar"></div>
  <div class="toolbar-hint" id="toolbarHint">요소를 클릭해 선택하세요. 노드를 더블클릭하면 편집 창이 열립니다.</div>
</div>

<main class="workspace">
  <div class="workspace-panel">
    <div class="canvas-card">
      <div class="svg-wrap">
        <svg class="stage" id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="stage-hint" id="stageHint"></div>
      </div>

const SVGNS = 'http://www.w3.org/2000/svg';
let __uid = 1;
function uid(prefix){ return (prefix||'n') + '_' + (__uid++); }
function deepClone(obj){ return obj === undefined ? undefined : JSON.parse(JSON.stringify(obj)); }
function el(tag, attrs, children){
  const e = document.createElementNS(SVGNS, tag);
  if (attrs) for (const k in attrs){ if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]); }
  if (children) children.forEach(c => c && e.appendChild(c));
  return e;
}
function htmlEl(tag, attrs, html){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  if (html !== undefined) e.innerHTML = html;
  return e;
}

    const marker = el('marker', {id, viewBox:'0 0 10 10', refX:9, refY:5, markerWidth:7, markerHeight:7, orient:'auto-start-reverse'});

    try {
      const downloads = await window.claude.use('downloads');
      if (downloads){
        try {
          await downloads.save({ filename, data: text });
          toast(msg);
          return;
        } catch(e){
          if (e && e.code === 'declined'){ toast('저장을 취소했습니다.'); return; }
          console.warn('downloads.save 실패, 일반 다운로드로 대체합니다.', e);
        }
      }
    } catch(e){ console.warn(e); }
  }
  // 일반 브라우저(로컬 html 파일)에서는 표준 다운로드 링크를 사용합니다.
  const blob = new Blob([text], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
  toast(msg);
}
function readJSONFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => { try{ resolve(JSON.parse(reader.result)); } catch(e){ reject(e); } };
    reader.onerror = reject;
    reader.readAsText(file);
  });
}
let __toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(__toastTimer);
  __toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}
function fmtTime(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

/* ---------- 모달 다이얼로그 ---------- */
let __modalOnClose = null;
function openModal({title, bodyHtml, mount, actions, wide, noAutoFocus}){
  document.getElementById('modalTitle').textContent = title || '';
  const body = document.getElementById('modalBody');
  body.innerHTML = bodyHtml || '';
  if (mount) mount(body);
  const foot = document.getElementById('modalFoot');
  foot.innerHTML = '';
  (actions||[]).forEach(a=>{
    const b = htmlEl('button', {class:'tbtn'+(a.primary?' primary':'')+(a.danger?' danger':''), onclick:()=>{ if (a.onClick(body) !== false) closeModal(); }}, a.label);
    foot.appendChild(b);
  });
  document.getElementById('modalBox').classList.toggle('wide', !!wide);
  __modalOnClose = null;
  document.getElementById('modalBackdrop').classList.add('show');
  if (!noAutoFocus){
    const firstInput = body.querySelector('input, select, textarea');
    if (firstInput) setTimeout(()=>firstInput.focus(), 30);
  }
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('show'); }

/* ---------- PNG 내보내기 (현재 다이어그램을 이미지로) ---------- */
async function exportPNG(){
  const svg = document.getElementById('stage');
  const clone = svg.cloneNode(true);
  const w = parseInt(svg.getAttribute('width'), 10) || svg.clientWidth || 800;
  const h = parseInt(svg.getAttribute('height'), 10) || svg.clientHeight || 480;
  clone.setAttribute('width', w); clone.setAttribute('height', h);
  clone.insertBefore(el('rect', {x:0,y:0,width:w,height:h,fill:'#FCFDFF'}), clone.firstChild);
  const xml = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([xml], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  try {
    const img = await new Promise((resolve, reject)=>{
      const im = new Image();
      im.onload = ()=>resolve(im);
      im.onerror = reject;
      im.src = url;
    });
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = w*scale; canvas.height = h*scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#FCFDFF'; ctx.fillRect(0,0,w,h);
    ctx.drawImage(img, 0, 0, w, h);
    const filename = `${APP.mode}_diagram_${Date.now()}.png`;
    if (window.claude && typeof window.claude.use === 'function'){
      try {
        const downloads = await window.claude.use('downloads');
        if (downloads){
          const pngBlob = await new Promise(res=>canvas.toBlob(res, 'image/png'));
          await downloads.save({ filename, data: pngBlob });
          toast('이미지로 저장되었습니다.');
          return;
        }
      } catch(e){
        if (e && e.code === 'declined'){ toast('저장을 취소했습니다.'); return; }
        console.warn('PNG downloads.save 실패, 일반 다운로드로 대체합니다.', e);
      }
    }
    canvas.toBlob((blob)=>{
      const dlUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = dlUrl; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(dlUrl); }, 200);
      toast('이미지로 저장되었습니다.');
    }, 'image/png');
  } finally {
    URL.revokeObjectURL(url);
  }
}
</script>

<script id="app-model-list">
/* =========================================================
   LINKED LIST MODEL
   내부적으로 order 배열(=head→tail 순서의 id 목록)이 연결 관계
   그 자체를 나타냅니다. next(i)=order[i+1], prev(i)=order[i-1].
   variant: 'singly' | 'doubly' | 'circular'
   cycleTo: (singly/doubly 전용) 교육용으로 강제로 만든 순환 대상 id
   ========================================================= */
class LinkedListModel {
  constructor(variant){
    this.variant = variant || 'singly';
    this.nodes = {};
    this.order = [];
    this.cycleTo = null;
  }
  exportState(){ return { variant:this.variant, nodes:deepClone(this.nodes), order:this.order.slice(), cycleTo:this.cycleTo }; }
  importState(s){ this.variant = s.variant; this.nodes = deepClone(s.nodes); this.order = s.order.slice(); this.cycleTo = s.cycleTo || null; this._relink(); }
  clear(){ this.nodes={}; this.order=[]; this.cycleTo=null; }
  get head(){ return this.order[0] || null; }
  get tail(){ return this.order[this.order.length-1] || null; }
  indexOfValue(v){ return this.order.findIndex(id=>this.nodes[id].value===v); }
  _mk(value){ const id=uid('L'); this.nodes[id]={id,value}; return id; }
  // 노드 객체에 실제 next(모든 종류)/prev(이중 연결 리스트만) 필드를 채워 넣습니다.
  // 단일·원형 리스트 노드는 prev 필드 자체가 없고(delete), 이중 연결 리스트 노드만 prev를 가집니다 — 실제 언어별 구조체 정의와 동일하게 맞춘 것입니다.
  _relink(){
    const n = this.order.length;
    for (let i=0;i<n;i++){
      const node = this.nodes[this.order[i]];
      if (!node) continue;
      if (i < n-1) node.next = this.order[i+1];
      else if (this.variant === 'circular') node.next = this.order[0];
      else if (this.cycleTo) node.next = this.cycleTo;
      else node.next = null;
      if (this.variant === 'doubly') node.prev = i>0 ? this.order[i-1] : null;
      else delete node.prev;
    }
  }
  nextIndex(i){
    if (i < this.order.length-1) return i+1;
    if (this.variant === 'circular') return this.order.length? 0 : -1;
    if (this.cycleTo) return this.order.indexOf(this.cycleTo);
    return -1;
  }

  insertHead(value, steps){
    const wasEmpty = this.order.length===0;
    const id = this._mk(value);
    this.order.unshift(id);
    this._relink();
    const prevNote = this.variant==='doubly' && !wasEmpty ? ' (이중 연결 리스트이므로 기존 head의 prev도 새 노드로 연결됩니다.)' : '';
    steps.push({narration: wasEmpty
      ? `빈 리스트이므로 새 노드(${value})가 head이자 tail이 됩니다.`
      : `새 노드(${value})를 만들고 head가 이 노드를 가리키도록 합니다. 기존 head는 새 노드의 next가 되며, tail은 그대로 유지됩니다.${prevNote}`, highlight:{nodes:[id]}});
  }
  insertTail(value, steps){
    const wasEmpty = this.order.length===0;
    const id = this._mk(value);
    this.order.push(id);
    this._relink();
    const prevNote = this.variant==='doubly' && !wasEmpty ? ' 새 노드의 prev는 기존 꼬리 노드로 연결됩니다.' : '';
    steps.push({narration: wasEmpty
      ? `빈 리스트이므로 새 노드(${value})가 head이자 tail이 됩니다.`
      : `꼬리 노드의 next가 새 노드(${value})를 가리키도록 연결하고, tail 포인터를 새 노드로 갱신합니다.${prevNote}`, highlight:{nodes:[id]}});
  }
  insertAt(index, value, steps){
    index = Math.max(0, Math.min(index, this.order.length));
    const isHeadInsert = index === 0 && this.order.length > 0;
    const isTailInsert = index === this.order.length && this.order.length > 0;
    for (let i=0;i<index;i++){
      steps.push({narration:`${i===0?'head':'현재 노드'}에서 next로 한 칸 이동합니다. (${i+1}/${index})`, highlight:{nodes:[this.order[i]]}});
    }
    const id = this._mk(value);
    this.order.splice(index,0,id);
    this._relink();
    let extra = isTailInsert ? ' tail 포인터가 새 노드로 갱신됩니다.' : (isHeadInsert ? ' head 포인터가 새 노드로 갱신됩니다.' : '');
    if (this.variant==='doubly') extra += ' 이중 연결 리스트이므로 앞뒤 노드의 next·prev가 모두 새 노드로 다시 연결됩니다.';
    steps.push({narration:`인덱스 ${index} 위치에 값 ${value} 노드를 끼워 넣고, 앞뒤 포인터를 새 노드로 다시 연결합니다.${extra}`, highlight:{nodes:[id]}});
  }
  deleteAt(index, steps){
    if (index<0 || index>=this.order.length){ steps.push({narration:`인덱스 ${index}는 범위를 벗어났습니다.`, highlight:{}}); return; }
    for (let i=0;i<index;i++) steps.push({narration:`탐색 중... 인덱스 ${i} 통과 (${i+1}/${index})`, highlight:{nodes:[this.order[i]]}});
    const id = this.order[index];
    const val = this.nodes[id].value;
    const isTailDelete = index === this.order.length-1;
    const isHeadDelete = index === 0;
    const doublyNote = this.variant==='doubly' && this.order.length>1 ? ' 이중 연결 리스트이므로 앞 노드의 next와 뒤 노드의 prev를 서로 다시 연결합니다.' : '';
    steps.push({narration:`인덱스 ${index}의 노드(값 ${val})를 찾았습니다. 이전 노드의 next를 이 노드의 next로 바꿔 건너뜁니다.${doublyNote}`, highlight:{nodes:[id]}});
    this.order.splice(index,1);
    if (this.cycleTo === id) this.cycleTo = null;
    delete this.nodes[id];
    this._relink();
    let extra = '';
    if (!this.order.length) extra = ' 리스트가 비어 head와 tail 모두 NULL이 됩니다.';
    else if (isTailDelete) extra = ` tail 포인터가 값 ${this.nodes[this.order[this.order.length-1]].value} 노드로 갱신됩니다.`;
    else if (isHeadDelete) extra = ` head 포인터가 값 ${this.nodes[this.order[0]].value} 노드로 갱신됩니다.`;
    steps.push({narration:`노드(값 ${val})가 메모리에서 해제되었습니다.${extra}`, highlight:{}});
  }
  deleteValue(value, steps){
    const idx = this.indexOfValue(value);
    if (idx<0){ steps.push({narration:`리스트에서 값 ${value}을(를) 찾지 못했습니다.`, highlight:{}}); return; }
    this.deleteAt(idx, steps);
  }
  search(value, steps){
    for (let i=0;i<this.order.length;i++){
      const id=this.order[i];
      const found = this.nodes[id].value === value;
      steps.push({narration: found?`인덱스 ${i}에서 값 ${value}을(를) 찾았습니다!`:`인덱스 ${i} (값 ${this.nodes[id].value}) 확인 → 일치하지 않음, next로 이동`, highlight:{nodes:[id]}});
      if (found) return i;
    }
    steps.push({narration:`끝(NULL)까지 도달했습니다. 값 ${value}을(를) 찾지 못했습니다.`, highlight:{}});
    return -1;
  }
  traverse(steps){
    const vals=[];
    const n = this.order.length;
    for (let i=0;i<n;i++){
      const id=this.order[i]; vals.push(this.nodes[id].value);
      steps.push({narration:`방문 ${i+1}/${n}: 값 ${this.nodes[id].value} → 현재까지 [${vals.join(', ')}]`, highlight:{nodes:[id]}});
    }
    let tail = this.variant==='circular' ? '출발한 head로 돌아왔습니다 (원형 구조). 한 바퀴 순회를 마칩니다.'
      : (this.cycleTo ? 'cycleTo가 설정되어 있어 실제로는 무한히 순회합니다 (여기서는 1회전만 표시).' : '끝(NULL)에 도달하여 순회를 마칩니다.');
    steps.push({narration:`${tail} 결과: [${vals.join(', ')}]`, highlight:{}});
  }
  reverse(steps){
    if (!this.order.length){ steps.push({narration:'빈 리스트입니다.', highlight:{}}); return; }
    steps.push({narration:'prev=NULL, cur=head로 시작합니다.', highlight:{nodes:[this.head]}});
    for (let i=0;i<this.order.length;i++){
      steps.push({narration:`${i+1}/${this.order.length}: 현재 노드(값 ${this.nodes[this.order[i]].value})의 next를 prev로 바꿉니다. prev·cur을 한 칸씩 전진합니다.`, highlight:{nodes:[this.order[i]]}});
    }
    this.order.reverse();
    this._relink();
    const doublyNote = this.variant==='doubly' ? ' (이중 연결 리스트이므로 모든 노드의 next·prev가 서로 맞바뀝니다.)' : '';
    steps.push({narration:`모든 화살표 방향이 반대가 되었습니다. 기존 head·tail의 역할이 서로 바뀌어 새 head는 값 ${this.nodes[this.head].value}, 새 tail은 값 ${this.nodes[this.tail].value}입니다.${doublyNote}`, highlight:{nodes:this.order.slice()}});
  }
  makeCycle(toIdx, steps){
    if (this.variant === 'circular'){ steps.push({narration:'원형 리스트는 이미 구조적으로 순환합니다.', highlight:{}}); return; }
    if (!this.order.length){ steps.push({narration:'리스트가 비어 있습니다.', highlight:{}}); return; }
    toIdx = Math.max(0, Math.min(toIdx, this.order.length-1));
    this.cycleTo = this.order[toIdx];
    this._relink();
    steps.push({narration:`(교육용 시연) 꼬리 노드의 next를 인덱스 ${toIdx}(값 ${this.nodes[this.cycleTo].value}) 노드로 강제 연결하여 순환을 만듭니다.`, highlight:{nodes:[this.tail, this.cycleTo]}});
  }
  setValueAt(index, value, steps){
    if (index<0 || index>=this.order.length){ steps.push({narration:`인덱스 ${index}는 범위를 벗어났습니다.`, highlight:{}}); return; }
    const id = this.order[index];
    const old = this.nodes[id].value;
    this.nodes[id].value = value;
    steps.push({narration:`인덱스 ${index}의 값을 ${old} → ${value}(으)로 수정했습니다.`, highlight:{nodes:[id]}});
  }
  removeCycle(steps){
    this.cycleTo = null;
    this._relink();
    steps.push({narration:'꼬리 노드의 next를 다시 NULL로 되돌렸습니다.', highlight:{nodes:this.tail?[this.tail]:[]}});
  }
  detectCycle(steps){
    if (!this.order.length){ steps.push({narration:'리스트가 비어 있습니다.', highlight:{}}); return false; }
    if (this.variant === 'circular'){ steps.push({narration:'원형 리스트이므로 항상 사이클이 존재합니다.', highlight:{nodes:[this.head]}}); return true; }
    let slow=0, fast=0;
    const n = this.order.length;
    for (let iter=0; iter<n*2+3; iter++){
      const ns = this.nextIndex(slow);
      const nf1 = this.nextIndex(fast);
      const nf2 = nf1>=0 ? this.nextIndex(nf1) : -1;
      if (ns<0 || nf1<0 || nf2<0){ steps.push({narration:'포인터가 NULL에 도달했습니다. 사이클이 없습니다.', highlight:{}}); return false; }
      slow=ns; fast=nf2;
      steps.push({narration:`slow → 값 ${this.nodes[this.order[slow]].value}, fast → 값 ${this.nodes[this.order[fast]].value}`, highlight:{nodes:[this.order[slow], this.order[fast]]}});
      if (slow===fast){ steps.push({narration:'느린 포인터와 빠른 포인터가 같은 노드에서 만났습니다! 사이클이 존재합니다.', highlight:{nodes:[this.order[slow]]}}); return true; }
    }
    steps.push({narration:'반복 한도에 도달했습니다.', highlight:{}});
    return false;
  }
}
</script>

<script id="app-model-tree">
/* =========================================================
   TREE MODEL (이진 트리 공용: BST 자동 모드 / 자유 배치 모드)
   nodes: {id:{id,value,left,right,visited}}
   variant: 'bst' | 'free'
   ========================================================= */
class TreeModel {
  constructor(variant){
    this.variant = variant || 'bst';
    this.nodes = {};
    this.root = null;
  }
  exportState(){ return { variant:this.variant, nodes:deepClone(this.nodes), root:this.root }; }
  importState(s){ this.variant = s.variant; this.nodes = deepClone(s.nodes); this.root = s.root; }
  clear(){ this.nodes={}; this.root=null; }
  clearVisited(){ Object.values(this.nodes).forEach(n=>{ n.visited=false; n.order=null; }); }
  _mk(value){ const id=uid('T'); this.nodes[id]={id,value,left:null,right:null,visited:false,order:null}; return id; }

  bstInsert(value, steps){
    if (!this.root){
      const id=this._mk(value); this.root=id;
      steps.push({narration:`트리가 비어 있으므로 값 ${value}이(가) 루트가 됩니다.`, highlight:{nodes:[id]}});
      return;
    }
    let cur = this.root;
    while (true){
      const node = this.nodes[cur];
      if (value === node.value){
        steps.push({narration:`값 ${value}은(는) 이미 트리에 존재합니다 (중복 무시).`, highlight:{nodes:[cur]}});
        return;
      }
      const goLeft = value < node.value;
      steps.push({narration:`${node.value}와(과) 비교: ${value} ${goLeft?'<':'>'} ${node.value} → ${goLeft?'왼쪽':'오른쪽'}으로 이동`, highlight:{nodes:[cur]}});
      const nextId = goLeft? node.left : node.right;
      if (!nextId){
        const id=this._mk(value);
        if (goLeft) node.left=id; else node.right=id;
        steps.push({narration:`빈 자리를 찾았습니다. ${node.value}의 ${goLeft?'왼쪽':'오른쪽'} 자식으로 값 ${value}을(를) 추가합니다.`, highlight:{nodes:[cur,id]}});
        return;
      }
      cur = nextId;
    }
  }
  _findMinNode(id, steps){
    let cur=id;
    while (this.nodes[cur].left){
      steps.push({narration:`후계자를 찾기 위해 왼쪽으로 이동: ${this.nodes[cur].value} → ${this.nodes[this.nodes[cur].left].value}`, highlight:{nodes:[cur]}});
      cur = this.nodes[cur].left;
    }
    return cur;
  }
  bstDelete(value, steps){
    let parent=null, cur=this.root, isLeftChild=false;
    while (cur && this.nodes[cur].value !== value){
      const node=this.nodes[cur];
      const goLeft = value < node.value;
      steps.push({narration:`${node.value}와(과) 비교: ${value} ${goLeft?'<':'>'} ${node.value} → ${goLeft?'왼쪽':'오른쪽'}으로 이동`, highlight:{nodes:[cur]}});
      parent=cur; isLeftChild=goLeft; cur = goLeft? node.left : node.right;
    }
    if (!cur){ steps.push({narration:`값 ${value}을(를) 트리에서 찾지 못했습니다.`, highlight:{}}); return; }
    const node = this.nodes[cur];
    steps.push({narration:`삭제할 노드(값 ${value})를 찾았습니다.`, highlight:{nodes:[cur]}});
    const replaceChild = (childId) => {
      if (!parent) this.root = childId;
      else if (isLeftChild) this.nodes[parent].left = childId;
      else this.nodes[parent].right = childId;
    };
    if (node.left && node.right){
      steps.push({narration:`자식이 둘입니다. 오른쪽 서브트리에서 중위 후계자(최소값)를 찾습니다.`, highlight:{nodes:[cur]}});
      const succParent_start = cur;
      const succ = this._findMinNode(node.right, steps);
      steps.push({narration:`후계자 값 ${this.nodes[succ].value}을(를) 삭제 위치로 복사합니다.`, highlight:{nodes:[cur, succ]}});
      const succVal = this.nodes[succ].value;
      // remove succ from its original spot (succ has no left child)
      this._removeNodeSimple(succ, node.right===succ ? cur : this._parentOf(succ), node.right===succ);
      node.value = succVal;
    } else {
      const child = node.left || node.right;
      steps.push({narration:`자식이 ${child? '하나' : '없습니다'}. ${child?'그 자식으로 대체합니다.':'그냥 제거합니다.'}`, highlight:{nodes:[cur]}});
      replaceChild(child);
      delete this.nodes[cur];
    }
    steps.push({narration:`삭제가 완료되었습니다.`, highlight:{}});
  }
  _parentOf(id){
    for (const k in this.nodes){ const n=this.nodes[k]; if (n.left===id || n.right===id) return k; }
    return null;
  }
  _removeNodeSimple(id, parentId, parentIsSameAsDeletedRightChild){
    const node = this.nodes[id];
    const child = node.left || node.right; // succ never has left child
    if (parentId){
      const p = this.nodes[parentId];
      if (p.left===id) p.left=child; else if (p.right===id) p.right=child;
    }
    delete this.nodes[id];
  }
  bstSearch(value, steps){
    let cur = this.root;
    while (cur){
      const node = this.nodes[cur];
      if (value === node.value){ steps.push({narration:`값 ${value}을(를) 찾았습니다!`, highlight:{nodes:[cur]}}); return cur; }
      const goLeft = value < node.value;
      steps.push({narration:`${node.value}와(과) 비교: ${value} ${goLeft?'<':'>'} ${node.value} → ${goLeft?'왼쪽':'오른쪽'}으로 이동`, highlight:{nodes:[cur]}});
      cur = goLeft? node.left : node.right;
    }
    steps.push({narration:`값 ${value}을(를) 찾지 못했습니다 (자식이 없는 지점에 도달).`, highlight:{}});
    return null;
  }
  manualInsert(parentId, side, value, steps){
    const id = this._mk(value);
    if (!parentId){
      this.root = id;
      steps.push({narration:`루트 노드로 값 ${value}을(를) 추가합니다.`, highlight:{nodes:[id]}});
      return id;
    }
    const p = this.nodes[parentId];
    if (side==='left') p.left = id; else p.right = id;
    steps.push({narration:`${p.value}의 ${side==='left'?'왼쪽':'오른쪽'} 자식으로 값 ${value}을(를) 배치합니다.`, highlight:{nodes:[parentId,id]}});
    return id;
  }
  setValue(id, value, steps){
    const node = this.nodes[id]; if (!node) return;
    const old = node.value; node.value = value;
    steps.push({narration:`노드 값을 ${old} → ${value}(으)로 수정했습니다.`, highlight:{nodes:[id]}});
  }
  manualDeleteSubtree(id, steps){
    const node = this.nodes[id];
    if (!node) return;
    const collect = (nid, arr)=>{ if(!nid) return; arr.push(nid); collect(this.nodes[nid].left, arr); collect(this.nodes[nid].right, arr); };
    const toRemove=[]; collect(id, toRemove);
    const valueLabel = node.value;
    const parentId = this._parentOf(id);
    if (parentId){ const p=this.nodes[parentId]; if (p.left===id) p.left=null; if (p.right===id) p.right=null; }
    if (this.root===id) this.root=null;
    toRemove.forEach(nid=>delete this.nodes[nid]);
    // steps.push은 삭제가 끝난 뒤에 호출해야 스냅샷에 삭제된 노드가 남지 않습니다.
    steps.push({narration:`값 ${valueLabel} 노드${toRemove.length>1?'와 그 아래 하위 트리':''}를 제거했습니다. (총 ${toRemove.length}개 노드)`, highlight:{}});
  }
  traversal(kind, steps){
    this.clearVisited();
    const order=[]; const vals=[];
    const mark = (id) => { this.nodes[id].visited=true; this.nodes[id].order = order.length+1; order.push(id); vals.push(this.nodes[id].value);
      steps.push({narration:`${labelOf(kind)} 방문 ${order.length}: 값 ${this.nodes[id].value} → [${vals.join(', ')}]`, highlight:{nodes:[id]}}); };
    const labelOf = k => ({preorder:'전위(Preorder)', inorder:'중위(Inorder)', postorder:'후위(Postorder)', levelorder:'레벨순회(BFS)'}[k]);
    if (!this.root){ steps.push({narration:'트리가 비어 있습니다.', highlight:{}}); return; }
    if (kind==='levelorder'){
      const q=[this.root];
      while(q.length){ const id=q.shift(); mark(id); const n=this.nodes[id]; if(n.left) q.push(n.left); if(n.right) q.push(n.right); }
    } else {
      const dfs=(id)=>{
        if(!id) return;
        const n=this.nodes[id];
        if (kind==='preorder') mark(id);
        dfs(n.left);
        if (kind==='inorder') mark(id);
        dfs(n.right);
        if (kind==='postorder') mark(id);
      };
      dfs(this.root);
    }
    steps.push({narration:`${labelOf(kind)} 순회 종료. 결과: [${vals.join(', ')}]`, highlight:{}});
  }
}
</script>

<script id="app-model-graph">
/* =========================================================
   GRAPH MODEL
   nodes: {id:{id,value,x,y,visited,dist}}
   edges: {id:{id,from,to,weight,directed}}
   ========================================================= */
class GraphModel {
  constructor(){ this.nodes={}; this.edges={}; }
  exportState(){ return { nodes:deepClone(this.nodes), edges:deepClone(this.edges) }; }
  importState(s){ this.nodes=deepClone(s.nodes); this.edges=deepClone(s.edges); }
  clear(){ this.nodes={}; this.edges={}; }
  clearAlgoState(){ Object.values(this.nodes).forEach(n=>{ n.visited=false; n.dist=null; }); }
  neighborsOf(id, directedAware){
    const res=[];
    Object.values(this.edges).forEach(e=>{
      if (e.from===id) res.push({to:e.to, edge:e});
      else if (!e.directed && e.to===id) res.push({to:e.from, edge:e});
    });
    return res;
  }
  addNode(value, x, y, steps){
    const id = uid('G');
    this.nodes[id] = {id, value, x, y, visited:false, dist:null};
    if (steps) steps.push({narration:`새 정점 ${value}을(를) 추가했습니다.`, highlight:{nodes:[id]}});
    return id;
  }
  setValue(id, value, steps){
    const node = this.nodes[id]; if (!node) return;
    const old = node.value; node.value = value;
    if (steps) steps.push({narration:`정점 값을 ${old} → ${value}(으)로 수정했습니다.`, highlight:{nodes:[id]}});
  }
  moveNode(id, x, y, steps){
    if (!this.nodes[id]) return;
    this.nodes[id].x = x; this.nodes[id].y = y;
    if (steps) steps.push({narration:`정점 ${this.nodes[id].value}의 위치를 옮겼습니다.`, highlight:{nodes:[id]}});
  }
  addEdge(fromId, toId, weight, directed, steps){
    if (fromId===toId){ if(steps) steps.push({narration:'같은 정점끼리는 연결할 수 없습니다.', highlight:{}}); return null; }
    const dup = Object.values(this.edges).find(e => (e.from===fromId&&e.to===toId) || (!directed && e.from===toId&&e.to===fromId));
    if (dup){ if(steps) steps.push({narration:'이미 존재하는 간선입니다.', highlight:{edges:[dup.id]}}); return null; }
    const id = uid('E');
    this.edges[id] = {id, from:fromId, to:toId, weight: (weight===undefined||weight===null||isNaN(weight))?1:weight, directed:!!directed};
    if (steps) steps.push({narration:`${this.nodes[fromId].value} ${directed?'→':'—'} ${this.nodes[toId].value} 간선(가중치 ${this.edges[id].weight})을 추가했습니다.`, highlight:{edges:[id], nodes:[fromId,toId]}});
    return id;
  }
  removeNode(id, steps){
    const node = this.nodes[id]; if (!node) return;
    const toRemove = Object.values(this.edges).filter(e=>e.from===id||e.to===id).map(e=>e.id);
    const valueLabel = node.value;
    toRemove.forEach(eid=>delete this.edges[eid]);
    delete this.nodes[id];
    // steps.push은 실제 삭제가 끝난 뒤에 호출해야 합니다 — makeStepRecorder가 push 시점의
    // 모델 상태를 스냅샷으로 저장하므로, 삭제 전에 push하면 "삭제됨" 단계의 화면에 삭제된
    // 정점/간선이 계속 남아있는 것처럼 보이는 버그가 있었습니다.
    if (steps) steps.push({narration:`정점 ${valueLabel}과(와) 연결된 간선 ${toRemove.length}개를 함께 제거했습니다.`, highlight:{}});
  }
  removeEdge(id, steps){
    const e = this.edges[id]; if (!e) return;
    const fromLabel = this.nodes[e.from]?.value, toLabel = this.nodes[e.to]?.value;
    delete this.edges[id];
    if (steps) steps.push({narration:`간선 ${fromLabel}-${toLabel}을(를) 제거했습니다.`, highlight:{}});
  }
  setEdge(id, weight, directed, steps){
    const e = this.edges[id]; if (!e) return;
    const oldW = e.weight, oldD = e.directed;
    e.weight = (weight===undefined||weight===null||isNaN(weight)) ? 1 : weight;
    e.directed = !!directed;
    if (steps) steps.push({narration:`간선 ${this.nodes[e.from]?.value}-${this.nodes[e.to]?.value}을(를) 수정했습니다 (가중치 ${oldW}→${e.weight}, 방향 ${oldD?'있음':'없음'}→${e.directed?'있음':'없음'}).`, highlight:{edges:[id]}});
  }
  bfs(startId, steps){
    this.clearAlgoState();
    if (!this.nodes[startId]) return;
    const visited = new Set([startId]);
    const order=[];
    const q=[startId];
    this.nodes[startId].dist = 0;
    steps.push({narration:`시작 정점 ${this.nodes[startId].value}을(를) 큐에 넣습니다.`, highlight:{nodes:[startId]}});
    while(q.length){
      const cur = q.shift();
      this.nodes[cur].visited = true;
      order.push(this.nodes[cur].value);
      steps.push({narration:`큐에서 ${this.nodes[cur].value}을(를) 꺼내 방문합니다. → 지금까지 [${order.join(', ')}]`, highlight:{nodes:[cur]}});
      const neigh = this.neighborsOf(cur).sort((a,b)=>(this.nodes[a.to].value>this.nodes[b.to].value?1:-1));
      for (const {to, edge} of neigh){
        if (!visited.has(to)){
          visited.add(to); q.push(to);
          this.nodes[to].dist = this.nodes[cur].dist + 1;
          steps.push({narration:`이웃 ${this.nodes[to].value}은(는) 미방문 → 큐에 추가 (거리 ${this.nodes[to].dist})`, highlight:{nodes:[to], edges:[edge.id]}});
        }
      }
    }
    steps.push({narration:`BFS 종료. 방문 순서: [${order.join(', ')}]`, highlight:{}});
  }
  dfs(startId, steps){
    this.clearAlgoState();
    if (!this.nodes[startId]) return;
    const visited = new Set();
    const order=[];
    const walk = (cur) => {
      visited.add(cur); this.nodes[cur].visited = true; order.push(this.nodes[cur].value);
      steps.push({narration:`정점 ${this.nodes[cur].value} 방문 → 지금까지 [${order.join(', ')}]`, highlight:{nodes:[cur]}});
      const neigh = this.neighborsOf(cur).sort((a,b)=>(this.nodes[a.to].value>this.nodes[b.to].value?1:-1));
      for (const {to, edge} of neigh){
        if (!visited.has(to)){
          steps.push({narration:`${this.nodes[cur].value} → ${this.nodes[to].value} 간선을 따라 더 깊이 들어갑니다.`, highlight:{nodes:[to], edges:[edge.id]}});
          walk(to);
        }
      }
    };
    walk(startId);
    steps.push({narration:`DFS 종료. 방문 순서: [${order.join(', ')}]`, highlight:{}});
  }
  dijkstra(startId, steps){
    this.clearAlgoState();
    if (!this.nodes[startId]) return;
    const dist = {}; Object.keys(this.nodes).forEach(id=>dist[id]=Infinity);
    dist[startId]=0;
    const done = new Set();
    steps.push({narration:`시작 정점 ${this.nodes[startId].value}의 거리를 0으로 둡니다. 나머지는 무한대(∞).`, highlight:{nodes:[startId]}});
    while (done.size < Object.keys(this.nodes).length){
      let cur=null, best=Infinity;
      for (const id in this.nodes){ if (!done.has(id) && dist[id]<best){ best=dist[id]; cur=id; } }
      if (cur===null) break;
      done.add(cur);
      this.nodes[cur].visited = true; this.nodes[cur].dist = dist[cur];
      steps.push({narration:`아직 확정 안 된 정점 중 거리 ${dist[cur]===Infinity?'∞':dist[cur]}로 최소인 ${this.nodes[cur].value}을(를) 확정합니다.`, highlight:{nodes:[cur]}});
      const neigh = this.neighborsOf(cur);
      for (const {to, edge} of neigh){
        if (done.has(to)) continue;
        const nd = dist[cur] + edge.weight;
        if (nd < dist[to]){
          const old = dist[to];
          dist[to] = nd;
          steps.push({narration:`${this.nodes[cur].value}을(를) 거쳐가면 ${this.nodes[to].value}까지 거리가 ${old===Infinity?'∞':old} → ${nd}로 줄어듭니다. 갱신!`, highlight:{nodes:[to], edges:[edge.id]}});
        }
      }
    }
    Object.keys(this.nodes).forEach(id=> this.nodes[id].dist = dist[id]===Infinity? null : dist[id]);
    const summary = Object.values(this.nodes).map(n=>`${n.value}:${n.dist===null?'∞':n.dist}`).join(', ');
    steps.push({narration:`다익스트라 종료. 최단 거리 — ${summary}`, highlight:{}});
  }
  toAdjacencyList(){
    const lines=[];
    Object.values(this.nodes).forEach(n=>{
      const neigh = this.neighborsOf(n.id).map(x=>`${this.nodes[x.to].value}(${x.edge.weight})`);
      lines.push(`${n.value}: [${neigh.join(', ')}]`);
    });
    return lines.join('\n') || '(정점 없음)';
  }
  toAdjacencyMatrix(){
    const ids = Object.keys(this.nodes);
    if (!ids.length) return '(정점 없음)';
    const vals = ids.map(id=>this.nodes[id].value);
    const header = '      ' + vals.map(v=>String(v).padStart(4)).join('');
    const rows=[header];
    ids.forEach(rid=>{
      const cells = ids.map(cid=>{
        if (rid===cid) return '0';
        const e = Object.values(this.edges).find(e=>(e.from===rid&&e.to===cid)||(!e.directed&&e.from===cid&&e.to===rid));
        return e? String(e.weight) : '.';
      });
      rows.push(String(this.nodes[rid].value).padStart(5)+' '+cells.map(c=>c.padStart(4)).join(''));
    });
    return rows.join('\n');
  }
}
</script>

<script id="app-render">
/* =========================================================
   RENDERERS — SVG 그리기 (list / tree / graph 공용)
   ========================================================= */
function sizeSVG(svg, w, h){
  const wrap = svg.parentElement;
  const minW = wrap ? wrap.clientWidth : w;
  const minH = wrap ? wrap.clientHeight : h;
  const finalW = Math.max(w, minW);
  const finalH = Math.max(h, minH);
  svg.setAttribute('width', finalW);
  svg.setAttribute('height', finalH);
  svg.style.width = finalW + 'px';
  svg.style.height = finalH + 'px';
}
function textEl(x, y, text, cls, extra){
  const t = el('text', Object.assign({x, y, class:cls}, extra||{}));
  t.textContent = text;
  return t;
}

/* ---------- LINKED LIST ---------- */
function renderList(svg, state, highlight, handlers){
  clearSVG(svg); ensureDefs(svg);
  const isDoubly = state.variant === 'doubly';
  // 이중 연결 리스트는 노드마다 prev|value|next 3칸을 모두 그려야 하므로 더 넓은 박스를 씁니다.
  const boxW = isDoubly ? 132 : 92, boxH=52, gap=50, startX = isDoubly ? 104 : 70, midY=230;
  const cVal  = isDoubly ? boxW*0.5   : boxW*0.3;   // 값 칸 중심 x 오프셋
  const cNext = isDoubly ? boxW*0.855 : boxW*0.8;   // next 칸 중심 x 오프셋
  const cPrev = boxW*0.145;                          // prev 칸 중심 x 오프셋 (doubly 전용)
  const n = state.order.length;
  const contentWidth = startX*2 + Math.max(n,1)*(boxW+gap) + 100;
  sizeSVG(svg, contentWidth, 480);
  const svgW = parseFloat(svg.getAttribute('width')) || contentWidth;
  const svgH = parseFloat(svg.getAttribute('height')) || 480;
  const hl = highlight||{}; const hlNodes = new Set(hl.nodes||[]);

  if (n){
    // (CSS 클래스의 fill 규칙이 SVG presentation attribute보다 우선하므로 inline style로 지정해야 실제로 색이 반영됩니다)
    svg.appendChild(textEl(startX+cVal, midY-46, 'HEAD', 'node-sublabel', {style:'fill:#0F7A73;font-weight:700'}));
    svg.appendChild(el('line', {x1:startX+cVal, y1:midY-38, x2:startX+cVal, y2:midY-boxH/2-2, stroke:'#0F7A73', 'stroke-width':2, 'marker-end':'url(#arrowRef)'}));
    // TAIL 포인터도 head와 마찬가지로 항상 시각적으로 관리·표시합니다 (꼬리 노드의 next 칸 위쪽을 가리킴)
    const tailX = startX + (n-1)*(boxW+gap) + cNext;
    svg.appendChild(textEl(tailX, midY-46, 'TAIL', 'node-sublabel', {style:'fill:#2F4B7C;font-weight:700'}));
    svg.appendChild(el('line', {x1:tailX, y1:midY-38, x2:tailX, y2:midY-boxH/2-2, stroke:'#2F4B7C', 'stroke-width':2, 'marker-end':'url(#arrowTail)'}));
  } else {
    // 캔버스 중앙에 표시 (text-anchor:middle 이므로 실제 렌더 폭/높이의 중심 좌표를 사용해야 잘리지 않음)
    svg.appendChild(textEl(svgW/2, svgH/2, '(빈 리스트 — 위 도구모음에서 삽입해 보세요)', 'node-sublabel'));
  }

  const px = {};
  for (let i=0;i<n;i++){
    const id = state.order[i];
    const x = startX + i*(boxW+gap);
    px[id] = x;
    const node = state.nodes[id];
    const isHl = hlNodes.has(id);
    const g = el('g', {cursor:'default'});
    if (isDoubly){
      // 노드 구조체에 next뿐 아니라 prev 필드가 실제로 존재함을 3칸(prev|value|next)으로 보여줍니다.
      const prevW = boxW*0.29, valW = boxW*0.42, nextW = boxW*0.29;
      g.appendChild(el('rect', {x, y:midY-boxH/2, width:prevW, height:boxH, class:'node-rect'+(isHl?' highlight':''), rx:6, fill:'#F5F7FB'}));
      g.appendChild(textEl(x+cPrev, midY, node.prev?'•':'∅', 'ptr-dot'));
      g.appendChild(el('rect', {x:x+prevW, y:midY-boxH/2, width:valW, height:boxH, class:'node-rect'+(isHl?' highlight':''), rx:6}));
      g.appendChild(textEl(x+cVal, midY, node.value, 'node-label'));
      g.appendChild(el('rect', {x:x+prevW+valW, y:midY-boxH/2, width:nextW, height:boxH, class:'node-rect'+(isHl?' highlight':''), rx:6, fill:'#F5F7FB'}));
      g.appendChild(textEl(x+cNext, midY, node.next?'•':'∅', 'ptr-dot'));
    } else {
      g.appendChild(el('rect', {x, y:midY-boxH/2, width:boxW*0.6, height:boxH, class:'node-rect'+(isHl?' highlight':''), rx:6}));
      g.appendChild(textEl(x+cVal, midY, node.value, 'node-label'));
      g.appendChild(el('rect', {x:x+boxW*0.6, y:midY-boxH/2, width:boxW*0.4, height:boxH, class:'node-rect'+(isHl?' highlight':''), rx:6, fill:'#F5F7FB'}));
      g.appendChild(textEl(x+cNext, midY, node.next?'•':'∅', 'ptr-dot'));
    }
    g.appendChild(textEl(x+cVal, midY+boxH/2+16, 'idx '+i, 'node-sublabel'));
    if (handlers && handlers.onNodeDblClick){ g.style.cursor='pointer'; g.addEventListener('dblclick', ()=>handlers.onNodeDblClick(id, i)); }
    svg.appendChild(g);
    if (isDoubly && !node.prev){
      // head 노드는 prev가 NULL → tail 쪽 NULL 종단과 대칭으로 왼쪽에도 NULL 박스를 그립니다.
      const prevCenterX = x + cPrev;
      const boxRight = prevCenterX - 34, boxLeft = boxRight - 32;
      svg.appendChild(el('line', {x1:prevCenterX, y1:midY, x2:boxRight+4, y2:midY, class:'edge-line', 'marker-end':'url(#arrowNormal)'}));
      svg.appendChild(el('rect', {x:boxLeft, y:midY-15, width:32, height:30, class:'null-box', rx:5}));
      svg.appendChild(el('line', {x1:boxLeft+3, y1:midY-11, x2:boxLeft+29, y2:midY+11, stroke:'#7C8698','stroke-width':1.4}));
      svg.appendChild(textEl(boxLeft+16, midY+27, 'NULL', 'node-sublabel'));
    }
  }
  // 노드 사이 연결 화살표: i -> i+1
  for (let i=0;i<n-1;i++){
    if (isDoubly){
      // next는 "다음 노드"를, prev는 "이전 노드"를 가리키는 것이지 서로의 포인터 칸을
      // 가리키는 것이 아니므로, 화살표도 각 노드의 몸통(박스 테두리)에 닿도록 따로 그립니다.
      // 두 화살표가 겹쳐 보이지 않도록 next는 위쪽, prev는 아래쪽으로 살짝 갈라 그립니다.
      const ay = midY - 10, py = midY + 10;
      const nextStartX = px[state.order[i]] + cNext, nextEndX = px[state.order[i+1]] + 3;
      svg.appendChild(el('path', {d:`M ${nextStartX} ${midY} L ${nextStartX} ${ay} L ${nextEndX} ${ay}`, fill:'none', class:'edge-line', 'marker-end':'url(#arrowNormal)'}));
      const prevStartX = px[state.order[i+1]] + cPrev, prevEndX = px[state.order[i]] + boxW - 3;
      svg.appendChild(el('path', {d:`M ${prevStartX} ${midY} L ${prevStartX} ${py} L ${prevEndX} ${py}`, fill:'none', class:'edge-line', 'marker-end':'url(#arrowNormal)'}));
    } else {
      const x1 = px[state.order[i]] + cNext;
      const x2 = px[state.order[i+1]];
      svg.appendChild(el('line', {x1, y1:midY, x2:x2-3, y2:midY, class:'edge-line', 'marker-end':'url(#arrowNormal)'}));
    }
  }
  // 꼬리 노드의 next 특수 케이스 (NULL / 원형 / 강제 순환)
  if (n){
    const lastId = state.order[n-1];
    const lx = px[lastId] + cNext;
    if (state.variant==='circular'){
      const hx = px[state.order[0]] + cVal;
      const path = `M ${lx} ${midY+boxH/2-2} C ${lx} ${midY+120}, ${hx} ${midY+120}, ${hx} ${midY+boxH/2+2}`;
      svg.appendChild(el('path', {d:path, fill:'none', stroke:'#C9962B','stroke-width':2,'marker-end':'url(#arrowGold)'}));
    } else if (state.cycleTo){
      const tx = px[state.cycleTo] + cVal;
      const path = `M ${lx} ${midY+boxH/2-2} C ${lx} ${midY+120}, ${tx} ${midY+120}, ${tx} ${midY+boxH/2+2}`;
      svg.appendChild(el('path', {d:path, fill:'none', stroke:'#B5502E','stroke-width':2,'marker-end':'url(#arrowGold)'}));
    } else {
      const nx = lx + 34;
      svg.appendChild(el('line', {x1:lx, y1:midY, x2:nx-4, y2:midY, class:'edge-line', 'marker-end':'url(#arrowNormal)'}));
      svg.appendChild(el('rect', {x:nx, y:midY-15, width:32, height:30, class:'null-box', rx:5}));
      svg.appendChild(el('line', {x1:nx+3, y1:midY-11, x2:nx+29, y2:midY+11, stroke:'#7C8698','stroke-width':1.4}));
      svg.appendChild(textEl(nx+16, midY+27, 'NULL', 'node-sublabel'));
    }
  }
}

/* ---------- TREE ---------- */
function computeTreeLayout(state){
  const pos = {};
  if (!state.root) return pos;
  // 중위 순회(in-order) 순서대로 x 슬롯을 하나씩 배정합니다. 모든 노드(리프뿐 아니라 중간 노드도)가
  // 서로 다른 슬롯을 차지하므로, 한쪽 자식만 있는 노드가 이어지는 경우에도 형제 서브트리와 절대
  // 겹치지 않습니다 (이전의 "리프에만 슬롯을 배정" 방식은 편향 트리에서 노드가 겹치는 버그가 있었습니다).
  let counter = 0;
  const XGAP = 64, YGAP = 78, STARTY = 56, STARTX = 60;
  const visit = (id, depth) => {
    if (!id) return;
    const node = state.nodes[id];
    visit(node.left, depth+1);
    pos[id] = { x: STARTX + counter*XGAP, y: STARTY + depth*YGAP };
    counter++;
    visit(node.right, depth+1);
  };
  visit(state.root, 0);
  return pos;
}
function renderTree(svg, state, highlight, handlers){
  clearSVG(svg); ensureDefs(svg);
  const pos = computeTreeLayout(state);
  const ids = Object.keys(state.nodes);
  let maxX=500, maxY=420;
  ids.forEach(id=>{ if(pos[id]){ maxX=Math.max(maxX,pos[id].x+70); maxY=Math.max(maxY,pos[id].y+70); } });
  sizeSVG(svg, maxX, Math.max(420, maxY));
  const hl = highlight||{}; const hlNodes = new Set(hl.nodes||[]);
  if (!state.root){
    // 캔버스 중앙에 표시 (text-anchor:middle 이므로 실제 렌더 폭/높이의 중심 좌표를 사용해야 잘리지 않음)
    const svgW = parseFloat(svg.getAttribute('width')) || maxX;
    const svgH = parseFloat(svg.getAttribute('height')) || Math.max(420, maxY);
    svg.appendChild(textEl(svgW/2, svgH/2, '(빈 트리 — 위 도구모음에서 값을 추가해 보세요)', 'node-sublabel'));
    return;
  }
  // edges first
  ids.forEach(id=>{
    const node = state.nodes[id]; const p = pos[id]; if(!p) return;
    [['left', node.left], ['right', node.right]].forEach(([side, childId])=>{
      if (childId && pos[childId]){
        const c = pos[childId];
        svg.appendChild(el('line', {x1:p.x, y1:p.y, x2:c.x, y2:c.y, class:'edge-line'}));
      }
    });
  });
  ids.forEach(id=>{
    const node = state.nodes[id]; const p = pos[id]; if(!p) return;
    const isHl = hlNodes.has(id);
    const cls = 'node-circle' + (isHl?' highlight': (node.visited?' visited':'')) + (id===state.root?' head':'');
    const g = el('g', {cursor:'pointer', 'data-id':id});
    g.appendChild(el('circle', {cx:p.x, cy:p.y, r:22, class:cls}));
    g.appendChild(textEl(p.x, p.y, node.value, 'node-label'));
    if (node.order) g.appendChild(textEl(p.x, p.y+34, '#'+node.order, 'node-sublabel'));
    if (handlers && handlers.onNodeClick) g.addEventListener('click', ()=>handlers.onNodeClick(id));
    if (handlers && handlers.onNodeDblClick) g.addEventListener('dblclick', (ev)=>{ ev.stopPropagation(); handlers.onNodeDblClick(id); });
    if (handlers && handlers.selectedId === id){
      g.appendChild(el('circle', {cx:p.x, cy:p.y, r:27, fill:'none', stroke:'#2F4B7C','stroke-width':2,'stroke-dasharray':'4,3'}));
    }
    svg.appendChild(g);
  });
}

/* ---------- GRAPH ---------- */
function renderGraph(svg, state, highlight, handlers){
  clearSVG(svg); ensureDefs(svg);
  sizeSVG(svg, 900, 480);
  const hl = highlight||{}; const hlNodes = new Set(hl.nodes||[]); const hlEdges = new Set(hl.edges||[]);
  const nodes = Object.values(state.nodes);
  if (!nodes.length){
    // 캔버스 중앙에 표시 (text-anchor:middle 이므로 실제 렌더 폭/높이의 중심 좌표를 사용해야 잘리지 않음)
    const svgW = parseFloat(svg.getAttribute('width')) || 900;
    const svgH = parseFloat(svg.getAttribute('height')) || 480;
    svg.appendChild(textEl(svgW/2, svgH/2, '(빈 그래프 — 캔버스를 클릭하여 정점을 추가하세요)', 'node-sublabel'));
  }
  Object.values(state.edges).forEach(e=>{
    const a = state.nodes[e.from], b = state.nodes[e.to]; if(!a||!b) return;
    const isHl = hlEdges.has(e.id);
    const isSel = !!(handlers && handlers.selectedEdgeId === e.id);
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    const r=24;
    const x1=a.x+dx/len*r, y1=a.y+dy/len*r, x2=b.x-dx/len*r, y2=b.y-dy/len*r;
    const marker = e.directed ? ('url(#'+(isHl?'arrowGold': isSel?'arrowTail':'arrowNormal')+')') : null;
    const line = el('line', {x1,y1,x2,y2, class:'edge-line'+(isHl?' highlight':'')+(isSel?' selected':''), 'marker-end': marker, 'pointer-events':'none'});
    svg.appendChild(line);
    // 클릭/더블클릭이 잘 걸리도록, 눈에 보이지 않는 굵은 선을 위에 겹쳐 클릭 판정 영역을 넓힙니다
    // (실제 선(1.8~3px)만으로는 정확히 클릭하기 어려워 "선택이 안 된다"고 느껴질 수 있음).
    const hit = el('line', {x1,y1,x2,y2, stroke:'transparent', 'stroke-width':14, cursor:'pointer'});
    if (handlers && handlers.onEdgeClick) hit.addEventListener('click', (ev)=>{ ev.stopPropagation(); handlers.onEdgeClick(e.id); });
    if (handlers && handlers.onEdgeDblClick) hit.addEventListener('dblclick', (ev)=>{ ev.stopPropagation(); handlers.onEdgeDblClick(e.id); });
    svg.appendChild(hit);
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    // 가중치 라벨은 간선 한가운데(클릭 판정 영역과 정확히 겹치는 지점)에 그려지므로,
    // pointer-events:none으로 클릭을 통과시켜 바로 아래의 hit 영역이 받도록 합니다.
    svg.appendChild(el('rect', {x:mx-11, y:my-9, width:22, height:16, fill:'#FCFDFF', opacity:.9, 'pointer-events':'none'}));
    svg.appendChild(textEl(mx, my+3, e.weight, 'edge-label', {'text-anchor':'middle', 'pointer-events':'none'}));
  });
  nodes.forEach(n=>{
    const isHl = hlNodes.has(n.id);
    const cls = 'node-circle' + (isHl?' highlight': (n.visited?' visited':''));
    const g = el('g', {cursor:'grab', 'data-id':n.id});
    g.appendChild(el('circle', {cx:n.x, cy:n.y, r:24, class:cls}));
    g.appendChild(textEl(n.x, n.y, n.value, 'node-label'));
    if (n.dist!==null && n.dist!==undefined) g.appendChild(textEl(n.x, n.y+38, 'd='+n.dist, 'node-sublabel'));
    if (handlers && handlers.selectedIds && handlers.selectedIds.includes(n.id)){
      g.appendChild(el('circle', {cx:n.x, cy:n.y, r:29, fill:'none', stroke:'#2F4B7C','stroke-width':2,'stroke-dasharray':'4,3'}));
    }
    if (handlers){
      g.addEventListener('mousedown', (ev)=> handlers.onNodeMouseDown && handlers.onNodeMouseDown(n.id, ev));
      g.addEventListener('click', (ev)=>{ ev.stopPropagation(); handlers.onNodeClick && handlers.onNodeClick(n.id); });
      g.addEventListener('dblclick', (ev)=>{ ev.stopPropagation(); handlers.onNodeDblClick && handlers.onNodeDblClick(n.id); });
    }
    svg.appendChild(g);
  });
  if (svg.__bgClickHandler) svg.removeEventListener('click', svg.__bgClickHandler);
  if (handlers && handlers.onCanvasClick){
    svg.__bgClickHandler = (ev)=>{
      const rect = svg.getBoundingClientRect();
      handlers.onCanvasClick(ev.clientX-rect.left, ev.clientY-rect.top);
    };
    svg.addEventListener('click', svg.__bgClickHandler);
  }
}
</script>

<script id="app-engine">
/* =========================================================
   ENGINE — 워크스페이스, 히스토리(기록), 재생, 저장/불러오기
   ========================================================= */
const APP = {
  mode: 'list',
  listVariant: 'singly',
  treeVariant: 'bst',
  ws: {},
  playing: false,
  playTimer: null,
  animToken: 0,
  speed: 800,
  graphTool: null,           // 'connect' | 'delete' | null
  connectFrom: null,         // 그래프 간선 연결 시작 정점
  selectedTreeNode: null,
  selectedGraphNodes: [],
  selectedGraphEdge: null,   // 선택된 간선 id (클릭으로 선택, 더블클릭으로 편집)
  drag: null,                // {id, moved}
  sideTab: 'playback'        // 오른쪽 패널의 현재 탭: 'playback' | 'help'
};

function makeStepRecorder(model){
  const arr = [];
  arr.push = function(entry){
    entry.highlight = entry.highlight || {};
    entry.snapshot = model.exportState();
    return Array.prototype.push.call(this, entry);
  };
  return arr;
}

function buildModel(mode){
  if (mode==='list') return new LinkedListModel(APP.listVariant);
  if (mode==='tree') return new TreeModel(APP.treeVariant);
  return new GraphModel();
}
function newWorkspace(mode){
  const model = buildModel(mode);
  return { mode, model, history: [], cursor: -1, emptySnapshot: model.exportState() };
}
function getWS(mode){
  mode = mode || APP.mode;
  if (!APP.ws[mode]) APP.ws[mode] = newWorkspace(mode);
  return APP.ws[mode];
}
function resetWorkspace(mode){ APP.ws[mode] = newWorkspace(mode); }
function getDisplayedSnapshot(ws){ return ws.cursor === -1 ? ws.emptySnapshot : ws.history[ws.cursor].snapshot; }
function getDisplayedHighlight(ws){ return ws.cursor === -1 ? {} : ws.history[ws.cursor].highlight; }
function getDisplayedNarration(ws){ return ws.cursor === -1 ? '초기 상태입니다. 위 도구모음에서 연산을 실행해 보세요.' : ws.history[ws.cursor].narration; }
function tempModelFromSnapshot(mode, snapshot){
  const m = buildModel(mode);
  m.importState(snapshot);
  return m;
}

// 모델 메서드 하나(fnName)를 실행하고 결과를 기록·재생하는 기존 경로.
function runOperation(fnName, args){
  runBatch((model, steps) => model[fnName].apply(model, args.concat([steps])));
}
// fn 안에서 모델 메서드를 원하는 만큼 자유롭게 호출할 수 있는 범용 버전입니다.
// (예: 예제 다이어그램처럼 여러 노드·간선을 한 번에 만들면서도, 재생 기록에는
// 그 과정이 실제 연산들의 나열로 그대로 남아 하나씩 되짚어볼 수 있게 합니다.)
function runBatch(modeOrNull, fn){
  if (typeof modeOrNull === 'function'){ fn = modeOrNull; modeOrNull = undefined; }
  const ws = getWS(modeOrNull);
  pausePlayback();
  // 항상 "가장 최신" 상태를 기준으로 실행합니다 (재생/되돌리기로 과거를 보고 있던 중이어도
  // 이전 연산이 애니메이션 중간에 끊겨 유실되지 않도록, cursor가 아닌 history의 끝을 기준으로 삼습니다).
  const latestSnapshot = ws.history.length ? ws.history[ws.history.length-1].snapshot : ws.emptySnapshot;
  ws.model.importState(latestSnapshot);
  const steps = makeStepRecorder(ws.model);
  try {
    fn(ws.model, steps);
  } catch(e){
    console.error(e);
    toast('연산 중 오류가 발생했습니다: ' + e.message);
    return;
  }
  if (!steps.length){ toast('변화가 없습니다.'); return; }
  const startIdx = ws.history.length;
  ws.history = ws.history.concat(steps);
  animateRange(ws, startIdx, ws.history.length-1);
}

function animateRange(ws, start, end){
  if (start > end) return;
  const myToken = ++APP.animToken;
  APP.playing = true; updatePlayButton();
  ws.cursor = start - 1;
  const tick = () => {
    if (myToken !== APP.animToken) return; // 더 최근 애니메이션이 시작되어 이 루프는 취소됨
    if (ws.cursor >= end){ APP.playing = false; updatePlayButton(); return; }
    ws.cursor++;
    refreshUI();
    if (ws.cursor < end){ APP.playTimer = setTimeout(tick, currentSpeed()); }
    else { APP.playing = false; updatePlayButton(); }
  };
  tick();
}
function currentSpeed(){
  const sel = document.getElementById('speedSel');
  if (sel){ APP.speed = parseInt(sel.value, 10) || 800; }
  return APP.speed || 800;
}
function updatePlayButton(){
  const b = document.getElementById('btnPlay');
  if (!b) return;
  b.innerHTML = APP.playing ? gicon('pause')+'일시정지' : gicon('play_arrow')+'재생';
}
function pausePlayback(){ APP.animToken++; APP.playing = false; clearTimeout(APP.playTimer); updatePlayButton(); }
function togglePlay(){
  const ws = getWS();
  if (APP.playing){ pausePlayback(); return; }
  if (ws.cursor >= ws.history.length-1){ toast('마지막 단계입니다.'); return; }
  const myToken = ++APP.animToken;
  APP.playing = true; updatePlayButton();
  const tick = () => {
    if (myToken !== APP.animToken) return;
    if (ws.cursor >= ws.history.length-1){ APP.playing=false; updatePlayButton(); return; }
    ws.cursor++;
    refreshUI();
    if (ws.cursor < ws.history.length-1){ APP.playTimer = setTimeout(tick, currentSpeed()); }
    else { APP.playing=false; updatePlayButton(); }
  };
  tick();
}
function stepForward(){ pausePlayback(); const ws=getWS(); if (ws.cursor < ws.history.length-1){ ws.cursor++; refreshUI(); } }
function stepBackward(){ pausePlayback(); const ws=getWS(); if (ws.cursor > -1){ ws.cursor--; refreshUI(); } }
function seekTo(idx){ pausePlayback(); const ws=getWS(); ws.cursor = Math.max(-1, Math.min(idx, ws.history.length-1)); refreshUI(); }

function clearCurrentWorkspace(){
  if (!confirm('현재 작업 중인 다이어그램과 기록이 모두 지워집니다. 계속할까요?')) return;
  resetWorkspace(APP.mode);
  APP.selectedTreeNode = null; APP.selectedGraphNodes = []; APP.connectFrom = null; APP.selectedGraphEdge = null;
  refreshUI();
}

/* ---------- 예제(테스트) 다이어그램 자동 생성 ----------
   각 자료구조(연결 리스트/트리/그래프) 모드에 어울리는 미리 정해진 다이어그램을
   실제 삽입·연결 연산의 나열로 만들어, 재생 기능으로 만들어지는 과정도
   처음부터 하나씩 되짚어볼 수 있게 합니다. */
function loadSampleDiagram(){
  const hasWork = getWS().history.length > 0;
  const msg = hasWork
    ? '현재 작업 중인 다이어그램과 기록이 모두 지워지고, 미리 만들어진 예제로 바뀝니다. 계속할까요?'
    : `${MODE_LABEL[APP.mode]} 예제 다이어그램을 만듭니다. 계속할까요?`;
  if (!confirm(msg)) return;
  resetWorkspace(APP.mode);
  APP.selectedTreeNode = null; APP.selectedGraphNodes = []; APP.connectFrom = null; APP.selectedGraphEdge = null;
  if (APP.mode === 'list') sampleList();
  else if (APP.mode === 'tree') sampleTree();
  else sampleGraph();
}
function sampleList(){
  // insertTail은 단일/이중/원형 연결 리스트 모두에서 _relink()가 종류에 맞게
  // next·prev(원형이면 마지막→첫 노드 순환까지)를 알아서 채워주므로, 종류 구분 없이 그대로 씁니다.
  runBatch((model, steps) => {
    [10, 20, 30, 40, 50].forEach(v => model.insertTail(v, steps));
  });
}
function sampleTree(){
  if (APP.treeVariant === 'bst'){
    runBatch((model, steps) => {
      [50, 30, 70, 20, 40, 60, 80].forEach(v => model.bstInsert(v, steps));
    });
  } else {
    runBatch((model, steps) => {
      const root = model.manualInsert(null, null, 1, steps);
      const l = model.manualInsert(root, 'left', 2, steps);
      const r = model.manualInsert(root, 'right', 3, steps);
      model.manualInsert(l, 'left', 4, steps);
      model.manualInsert(l, 'right', 5, steps);
      model.manualInsert(r, 'right', 6, steps);
    });
  }
}
function sampleGraph(){
  runBatch((model, steps) => {
    const a = model.addNode(1, 150, 110, steps);
    const b = model.addNode(2, 420, 80, steps);
    const c = model.addNode(3, 420, 260, steps);
    const d = model.addNode(4, 690, 110, steps);
    const e = model.addNode(5, 690, 300, steps);
    model.addEdge(a, b, 4, false, steps);
    model.addEdge(a, c, 2, false, steps);
    model.addEdge(b, d, 5, false, steps);
    model.addEdge(c, d, 8, false, steps);
    model.addEdge(c, e, 10, false, steps);
    model.addEdge(d, e, 2, false, steps);
  });
}

/* ---------- 저장 / 불러오기 ---------- */
function saveDiagram(){
  const ws = getWS();
  const payload = {
    kind: 'dsa-diagram', version: 1, mode: APP.mode,
    listVariant: APP.listVariant, treeVariant: APP.treeVariant,
    savedAt: fmtTime(),
    finalState: getDisplayedSnapshot(ws)
  };
  downloadJSON(payload, `${APP.mode}_diagram_${Date.now()}.json`, '다이어그램을 저장했습니다.');
}
function saveRecording(){
  const ws = getWS();
  if (!ws.history.length){ toast('저장할 기록이 없습니다. 먼저 다이어그램을 만들어 보세요.'); return; }
  const payload = {
    kind: 'dsa-recording', version: 1, mode: APP.mode,
    listVariant: APP.listVariant, treeVariant: APP.treeVariant,
    savedAt: fmtTime(),
    emptySnapshot: ws.emptySnapshot,
    history: ws.history
  };
  downloadJSON(payload, `${APP.mode}_recording_${Date.now()}.json`, '제작 과정 기록을 저장했습니다. 재생 버튼으로 처음부터 다시 볼 수 있습니다.');
}
async function loadFile(file){
  if (!file) return;
  let data;
  try { data = await readJSONFile(file); } catch(e){ toast('JSON 파일을 읽을 수 없습니다.'); return; }
  if (!data || (data.kind !== 'dsa-diagram' && data.kind !== 'dsa-recording')){ toast('이 도구에서 저장한 파일이 아닙니다.'); return; }
  if (!['list','tree','graph'].includes(data.mode)){ toast('알 수 없는 자료구조 종류입니다.'); return; }
  if (data.listVariant) APP.listVariant = data.listVariant;
  if (data.treeVariant) APP.treeVariant = data.treeVariant;
  switchMode(data.mode, true);
  const ws = getWS(data.mode);
  // tempModelFromSnapshot(...).exportState()를 한 번 거치면 모델의 importState가 내부 정합성(예:
  // 연결 리스트의 next/prev 필드)을 다시 계산해 주므로, 예전 형식으로 저장된 파일을 불러와도 항상
  // 최신 데이터 구조로 보정됩니다.
  if (data.kind === 'dsa-diagram'){
    const normalized = tempModelFromSnapshot(data.mode, data.finalState).exportState();
    ws.history = [{ seq:0, narration:'파일에서 다이어그램을 불러왔습니다.', highlight:{}, snapshot: normalized }];
    ws.cursor = 0;
    ws.emptySnapshot = buildModel(data.mode).exportState();
  } else {
    ws.emptySnapshot = data.emptySnapshot;
    ws.history = data.history.map(h => ({...h, snapshot: tempModelFromSnapshot(data.mode, h.snapshot).exportState()}));
    ws.cursor = -1;
  }
  buildToolbar();
  refreshUI();
  toast('불러오기가 완료되었습니다.');
}
</script>

/* ---------- 도움말 패널(캔버스 오른쪽 탭) — 자료구조별 간단한 개념도 + 구체적인 사용법 ---------- */
function rarrow(x1,y,x2){ // 수평 화살표 (수평선 + 삼각형 화살촉), x2<x1이면 왼쪽을 향합니다
  const dir = x2>x1 ? 1 : -1;
  return `<line x1="${x1}" y1="${y}" x2="${x2-6*dir}" y2="${y}" stroke="#4A5468" stroke-width="1.8"/>
          <polygon points="${x2},${y} ${x2-8*dir},${y-4} ${x2-8*dir},${y+4}" fill="#4A5468"/>`;
}
function diagArrow(x1,y1,x2,y2,color){ // 임의 방향(대각선 포함) 화살표
  color = color || '#4A5468';
  const dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy)||1;
  const ux=dx/len, uy=dy/len;
  const backX = x2-10*ux, backY = y2-10*uy;
  const perpX = -uy, perpY = ux;
  const p1x = backX+4*perpX, p1y = backY+4*perpY;
  const p2x = backX-4*perpX, p2y = backY-4*perpY;
  return `<line x1="${x1}" y1="${y1}" x2="${backX.toFixed(1)}" y2="${backY.toFixed(1)}" stroke="${color}" stroke-width="1.8"/>
          <polygon points="${x2},${y2} ${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}" fill="${color}"/>`;
}
function conceptSVG_list(variant){
  const vals = [10,20,30];
  const isDoubly = variant==='doubly';
  // 이중 연결 리스트는 첫 노드 왼쪽에 prev용 ∅ 표시를 그릴 여백이 더 필요합니다.
  const boxW = isDoubly?52:58, boxH=34, gap = isDoubly?28:36, startX = isDoubly?38:14, topY=isDoubly?40:34;
  const centers = vals.map((v,i)=> startX + i*(boxW+gap));
  let boxes='', nextArrows='', prevArrows='';
  vals.forEach((v,i)=>{
    const x = centers[i];
    boxes += `<rect x="${x}" y="${topY}" width="${boxW}" height="${boxH}" rx="6" class="node-rect"/>
      <text x="${x+boxW/2}" y="${topY+boxH/2}" class="node-label" dominant-baseline="middle">${v}</text>`;
    if (i===0) boxes += `<text x="${x+boxW/2}" y="${topY-14}" class="node-sublabel" style="font-size:10.5px;fill:#0F7A73;font-weight:700;" text-anchor="middle">HEAD ▾</text>`;
    if (i===vals.length-1) boxes += `<text x="${x+boxW/2}" y="${topY-14}" class="node-sublabel" style="font-size:10.5px;fill:#2F4B7C;font-weight:700;" text-anchor="middle">TAIL ▾</text>`;
  });
  const midY = topY+boxH/2;
  for (let i=0;i<vals.length-1;i++){
    nextArrows += rarrow(centers[i]+boxW+2, midY-(variant==='doubly'?6:0), centers[i+1]-2);
    if (variant==='doubly') nextArrows += rarrow(centers[i+1]-2, midY+6, centers[i]+boxW+2);
  }
  let tailSvg='';
  if (variant==='circular'){
    const lastX = centers[centers.length-1]+boxW/2, firstX = centers[0]+boxW/2;
    tailSvg = `<path d="M ${lastX} ${topY+boxH} C ${lastX} ${topY+boxH+34}, ${firstX} ${topY+boxH+34}, ${firstX} ${topY+boxH+2}" fill="none" stroke="#4A5468" stroke-width="1.8"/>
      <polygon points="${firstX},${topY+boxH+2} ${firstX-5},${topY+boxH+10} ${firstX+5},${topY+boxH+10}" fill="#4A5468"/>
      <text x="${(lastX+firstX)/2}" y="${topY+boxH+48}" text-anchor="middle" class="node-sublabel">마지막 노드의 next가 다시 head를 가리킵니다</text>`;
  } else {
    const lx = centers[centers.length-1]+boxW+2;
    tailSvg = `${rarrow(lx, midY-(variant==='doubly'?6:0), lx+26)}<text x="${lx+34}" y="${midY-(variant==='doubly'?6:0)}" class="node-sublabel" style="font-size:13px;" dominant-baseline="middle">∅</text>`;
    if (variant==='doubly') tailSvg += `<text x="${centers[0]-24}" y="${midY+6}" class="node-sublabel" style="font-size:13px;" dominant-baseline="middle">∅</text>${rarrow(centers[0]-2, midY+6, centers[0]-26)}`;
  }
  const vh = variant==='circular' ? 190 : (isDoubly?120:100);
  const vw = isDoubly ? 340 : 300;
  return `<svg viewBox="0 0 ${vw} ${vh}" width="100%" height="${vh}">${boxes}${nextArrows}${tailSvg}</svg>`;
}
function conceptSVG_tree(variant){
  const isBst = variant==='bst';
  const vals = isBst ? [50,30,70] : ['P','L','R'];
  return `<svg viewBox="0 0 220 150" width="100%" height="150">
    <line x1="110" y1="32" x2="62" y2="86" stroke="#4A5468" stroke-width="1.8"/>
    <line x1="110" y1="32" x2="158" y2="86" stroke="#4A5468" stroke-width="1.8"/>
    <circle cx="110" cy="32" r="20" class="node-circle head"/>
    <text x="110" y="32" class="node-label" dominant-baseline="middle">${vals[0]}</text>
    <text x="110" y="14" text-anchor="middle" class="node-sublabel" style="font-size:10px;">부모(root)</text>
    <circle cx="62" cy="86" r="20" class="node-circle"/>
    <text x="62" y="86" class="node-label" dominant-baseline="middle">${vals[1]}</text>
    <text x="62" y="118" text-anchor="middle" class="node-sublabel" style="font-size:10px;">왼쪽 자식</text>
    <circle cx="158" cy="86" r="20" class="node-circle"/>
    <text x="158" y="86" class="node-label" dominant-baseline="middle">${vals[2]}</text>
    <text x="158" y="118" text-anchor="middle" class="node-sublabel" style="font-size:10px;">오른쪽 자식</text>
    ${isBst ? `<text x="110" y="140" text-anchor="middle" class="node-sublabel" style="font-size:11px;">왼쪽 자식(30) &lt; 부모(50) &lt; 오른쪽 자식(70)</text>` : ''}
  </svg>`;
}
function conceptSVG_graph(){
  // B(150,34) → D(210,114) 대각선 방향 간선: 원 테두리(반지름 18)에서 시작·끝나도록 계산합니다.
  const arrow = diagArrow(150+0.6*18, 34+0.8*18, 210-0.6*18, 114-0.8*18);
  return `<svg viewBox="0 0 260 140" width="100%" height="140">
    <line x1="50" y1="34" x2="150" y2="34" stroke="#4A5468" stroke-width="1.8"/>

    <line x1="50" y1="34" x2="50" y2="114" stroke="#4A5468" stroke-width="1.8"/>
    ${arrow}
    <text x="195" y="62" text-anchor="middle" class="node-sublabel" style="font-size:11px;">5</text>
    <circle cx="50" cy="34" r="18" class="node-circle"/><text x="50" y="34" class="node-label" dominant-baseline="middle">A</text>
    <circle cx="150" cy="34" r="18" class="node-circle"/><text x="150" y="34" class="node-label" dominant-baseline="middle">B</text>
    <circle cx="50" cy="114" r="18" class="node-circle"/><text x="50" y="114" class="node-label" dominant-baseline="middle">C</text>
    <circle cx="210" cy="114" r="18" class="node-circle"/><text x="210" y="114" class="node-label" dominant-baseline="middle">D</text>
  </svg>`;
}
const HELP_CONTENT = {
  list: {
    concept: variant => conceptSVG_list(variant),

function renderHelpContent(){
  const container = document.getElementById('helpPanelContent');
  if (!container) return;
  const mode = APP.mode;
  const cfg = HELP_CONTENT[mode];
  let variantKey, captionKey;
  if (mode==='list'){ variantKey = APP.listVariant; captionKey = APP.listVariant; }
  else if (mode==='tree'){ variantKey = APP.treeVariant; captionKey = APP.treeVariant; }
  else { variantKey = undefined; captionKey = 'default'; }
  const conceptSvg = cfg.concept(variantKey);
  const caption = cfg.conceptCaption[captionKey] || '';
  const usageHtml = typeof cfg.usage === 'function' ? cfg.usage() : cfg.usage;
  container.innerHTML = `
    <h4><span class="gicon">auto_awesome_motion</span>${MODE_LABEL[mode]} 개념도</h4>
