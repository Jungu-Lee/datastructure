function openEditGraphModal(id){
  const snap = getDisplayedSnapshot(getWS('graph'));
  const node = snap.nodes[id]; if (!node) return;
  openModal({
    title: '정점 편집',
    bodyHtml: `<div class="form-row"><input type="text" id="modalEditVal" value="${escapeHtml(String(node.value))}"></div><div class="helpbox">삭제하면 연결된 모든 간선도 함께 삭제됩니다.</div>`,
    actions: [
      { label:'취소', onClick:()=>true },
      { label:'삭제', danger:true, onClick:()=>{ runOperation('removeNode',[id]); } },
      { label:'저장', primary:true, onClick:(body)=>{ runOperation('setValue',[id, coerceVal(body.querySelector('#modalEditVal').value)]); } }
    ]
  });
}
function openEditEdgeModal(id){
  const snap = getDisplayedSnapshot(getWS('graph'));
  const edge = snap.edges[id]; if (!edge) return;
  const fromNode = snap.nodes[edge.from], toNode = snap.nodes[edge.to];
  openModal({
    title: '간선 편집',
    bodyHtml: `
      <div class="helpbox">${escapeHtml(String(fromNode?fromNode.value:'?'))} ${edge.directed?'→':'—'} ${escapeHtml(String(toNode?toNode.value:'?'))}</div>
      <div class="form-row">
        <input type="number" id="modalEdgeWeight" value="${escapeHtml(String(edge.weight))}" placeholder="가중치">
        <label class="opt" style="display:flex;align-items:center;gap:5px;"><input type="checkbox" id="modalEdgeDirected"${edge.directed?' checked':''}> 방향</label>
      </div>`,
    actions: [
      { label:'취소', onClick:()=>true },
      { label:'삭제', danger:true, onClick:()=>{ runOperation('removeEdge',[id]); } },
      { label:'저장', primary:true, onClick:(body)=>{
          const w = parseFloat(body.querySelector('#modalEdgeWeight').value);
          const d = body.querySelector('#modalEdgeDirected').checked;
          runOperation('setEdge', [id, w, d]);
        } }
    ]
  });
}

function buildVariantSelect(){
  if (APP.mode === 'list'){
    const sel = htmlEl('select', {class:'tbar-select', title:'리스트 종류'});
    sel.innerHTML = [['singly','단일 연결 리스트'],['doubly','이중 연결 리스트'],['circular','원형 연결 리스트']]
      .map(([v,l])=>`<option value="${v}"${APP.listVariant===v?' selected':''}>${l}</option>`).join('');
    sel.addEventListener('change', ()=>{
      const val = sel.value;
      if (APP.ws.list && APP.ws.list.history.length && !confirm('리스트 종류를 바꾸면 현재 작업이 초기화됩니다. 계속할까요?')){ sel.value = APP.listVariant; return; }
      APP.listVariant = val; resetWorkspace('list'); buildToolbar(); refreshUI();
    });
    return sel;
  }
  if (APP.mode === 'tree'){
    const sel = htmlEl('select', {class:'tbar-select', title:'트리 모드'});
    sel.innerHTML = [['bst','이진 탐색 트리(자동)'],['free','자유 배치']]
      .map(([v,l])=>`<option value="${v}"${APP.treeVariant===v?' selected':''}>${l}</option>`).join('');
    sel.addEventListener('change', ()=>{
      const val = sel.value;
      if (APP.ws.tree && APP.ws.tree.history.length && !confirm('트리 모드를 바꾸면 현재 작업이 초기화됩니다. 계속할까요?')){ sel.value = APP.treeVariant; return; }
      APP.treeVariant = val; resetWorkspace('tree'); buildToolbar(); refreshUI();
    });
    return sel;
  }
  return null;
}

function buildToolbar(){
  const tb = document.getElementById('toolbar');
  // 그래프 모드의 인라인 입력값은 도구모음이 다시 그려져도 유지합니다.
  const prevNodeVal = document.getElementById('graphNodeValue') ? document.getElementById('graphNodeValue').value : null;
  const prevWeight = document.getElementById('graphWeight') ? document.getElementById('graphWeight').value : null;
  const prevDirected = document.getElementById('graphDirected') ? document.getElementById('graphDirected').checked : null;
  tb.innerHTML = '';

  // 1) 종류/모드 선택
  const variantSel = buildVariantSelect();
  if (variantSel){
    const grp = htmlEl('div', {class:'grp'});
    grp.appendChild(variantSel);
    tb.appendChild(grp);
  }

  // 2) 모드별 편집·연산 도구
  const grpOps = htmlEl('div', {class:'grp'});
  if (APP.mode === 'list'){
    grpOps.appendChild(htmlEl('button', {class:'tbtn accent', onclick:openInsertListModal}, gicon('add')+'삽입'));
    grpOps.appendChild(htmlEl('button', {class:'tbtn', onclick:openDeleteListModal}, gicon('remove')+'삭제'));
    grpOps.appendChild(htmlEl('button', {class:'tbtn', onclick:openSearchListModal}, gicon('search')+'탐색'));
    grpOps.appendChild(htmlEl('button', {class:'tbtn', onclick:()=>runOperation('traverse',[])}, gicon('directions_walk')+'순회'));
    grpOps.appendChild(htmlEl('button', {class:'tbtn', onclick:()=>runOperation('reverse',[])}, gicon('sync_alt')+'뒤집기'));
    if (APP.listVariant !== 'circular'){
      grpOps.appendChild(htmlEl('button', {class:'tbtn', onclick:openCycleListModal}, gicon('loop')+'순환 실습'));
    }
    grpOps.appendChild(htmlEl('button', {class:'tbtn accent', onclick:loadSampleDiagram}, gicon('auto_awesome')+'예제 만들기'));
  } else if (APP.mode === 'tree'){
    if (APP.treeVariant === 'bst'){
      grpOps.appendChild(htmlEl('button', {class:'tbtn accent', onclick:openInsertTreeModal}, gicon('add')+'삽입'));
      grpOps.appendChild(htmlEl('button', {class:'tbtn', onclick:openDeleteTreeModal}, gicon('remove')+'삭제'));
      grpOps.appendChild(htmlEl('button', {class:'tbtn', onclick:openSearchTreeModal}, gicon('search')+'탐색'));
    } else {
      grpOps.appendChild(htmlEl('button', {class:'tbtn accent', onclick:openAddChildTreeModal}, gicon('add')+'자식 추가'));
    }
    grpOps.appendChild(htmlEl('button', {class:'tbtn', onclick:openTreeTraversalModal}, gicon('directions_walk')+'순회'));
    grpOps.appendChild(htmlEl('button', {class:'tbtn accent', onclick:loadSampleDiagram}, gicon('auto_awesome')+'예제 만들기'));
  } else { // graph
    const mk = (tool, label) => htmlEl('button', {class:'tbtn'+(APP.graphTool===tool?' active':''), onclick:()=>{
        APP.graphTool = (APP.graphTool===tool)? null : tool;
        APP.connectFrom = null;
        buildToolbar();
        refreshUI();
      }}, label);
    grpOps.appendChild(mk('add', gicon('add_circle')+'정점 추가'));
    grpOps.appendChild(htmlEl('input', {type:'text', id:'graphNodeValue', class:'tbar-input narrow', placeholder:'값', value: prevNodeVal!==null?prevNodeVal:nextGraphNodeDefault()}));
    grpOps.appendChild(mk('connect', gicon('link')+'간선 연결'));
    grpOps.appendChild(htmlEl('input', {type:'number', id:'graphWeight', class:'tbar-input narrow', placeholder:'가중치', value: prevWeight!==null?prevWeight:'1'}));
    const chk = htmlEl('label', {class:'tbar-check'}, `<input type="checkbox" id="graphDirected"${prevDirected?' checked':''}> 방향`);
    grpOps.appendChild(chk);
    grpOps.appendChild(mk('delete', gicon('delete')+'클릭하여 삭제'));
    grpOps.appendChild(htmlEl('button', {class:'tbtn', onclick:openGraphSearchModal}, gicon('travel_explore')+'탐색 실행'));
    grpOps.appendChild(htmlEl('button', {class:'tbtn', onclick:openGraphAdjModal}, gicon('table_chart')+'인접 리스트/행렬'));
    grpOps.appendChild(htmlEl('button', {class:'tbtn accent', onclick:loadSampleDiagram}, gicon('auto_awesome')+'예제 만들기'));
  }
  tb.appendChild(grpOps);

  // 3) 편집 상태
  const grpEdit = htmlEl('div', {class:'grp'});
  grpEdit.appendChild(htmlEl('button', {class:'tbtn danger', onclick:clearCurrentWorkspace}, gicon('delete_sweep')+'전체 초기화'));
  tb.appendChild(grpEdit);

  // 4) 파일 (저장/불러오기/내보내기) — 모든 모드 공통
  const grpFile = htmlEl('div', {class:'grp'});
  grpFile.appendChild(htmlEl('button', {class:'tbtn', onclick:saveDiagram}, gicon('save')+'다이어그램 저장'));
  grpFile.appendChild(htmlEl('button', {class:'tbtn', onclick:()=>document.getElementById('loadDiagramInput').click()}, gicon('folder_open')+'불러오기'));
  grpFile.appendChild(htmlEl('button', {class:'tbtn', onclick:saveRecording}, gicon('movie')+'기록 저장'));
  grpFile.appendChild(htmlEl('button', {class:'tbtn', onclick:()=>document.getElementById('loadRecordingInput').click()}, gicon('video_library')+'기록 불러오기'));
  grpFile.appendChild(htmlEl('button', {class:'tbtn', onclick:exportPNG}, gicon('image')+'PNG 내보내기'));
  tb.appendChild(grpFile);

  // 5) 도움말 (캔버스 오른쪽 패널의 "도움말" 탭을 엽니다 — 모달 아님)
  const grpView = htmlEl('div', {class:'grp'});
  grpView.appendChild(htmlEl('button', {class:'tbtn', onclick:openHelpPanel}, gicon('help')+'도움말'));
  tb.appendChild(grpView);
}

function nodeValueOf(mode, id){
  const ws = getWS(mode);
  const snap = getDisplayedSnapshot(ws);
  const n = snap.nodes && snap.nodes[id];
  return n ? n.value : '?';
}
function nextGraphNodeDefault(){
  const ws = getWS('graph');
  const snap = getDisplayedSnapshot(ws);
  return Object.keys(snap.nodes||{}).length + 1;
}
function graphNodeOptions(){
  const ws = getWS('graph');
  const snap = getDisplayedSnapshot(ws);
  const nodes = Object.values(snap.nodes||{});
  if (!nodes.length) return '<option value="">(정점 없음)</option>';
  return nodes.map(n=>`<option value="${n.id}">${n.value}</option>`).join('');
}
function readVal(id){ const v=document.getElementById(id).value; return v===''? '?' : (isNaN(v)? v : Number(v)); }
function readNum(id){ const v=parseFloat(document.getElementById(id).value); return isNaN(v)? 0 : v; }
function readSelect(id){ return document.getElementById(id).value; }

function buildGraphHandlers(){
  return {
    selectedIds: APP.connectFrom ? [APP.connectFrom] : [],
    selectedEdgeId: APP.selectedGraphEdge,
    onNodeMouseDown: (id, ev) => {
      APP.drag = { id, moved:false, startClientX: ev.clientX, startClientY: ev.clientY };
    },
    onNodeClick: (id) => {
      if (graphJustDragged){ graphJustDragged=false; return; }
      APP.selectedGraphEdge = null;
      if (APP.graphTool === 'connect'){
        if (!APP.connectFrom) { APP.connectFrom = id; refreshUI(); }
        else if (APP.connectFrom === id){ APP.connectFrom = null; refreshUI(); }
        else {
          const w = readNum('graphWeight') || 1;
          const d = document.getElementById('graphDirected').checked;
          const from = APP.connectFrom; APP.connectFrom = null;
          runOperation('addEdge', [from, id, w, d]);
        }
      } else if (APP.graphTool === 'delete'){
        if (confirm('이 정점과 연결된 모든 간선을 함께 삭제할까요?')) runOperation('removeNode', [id]);
      } else {
        refreshUI(); // 선택 해제(selectedGraphEdge=null)를 화면에 반영
      }
    },
    onEdgeClick: (id) => {
      if (canvasJustPanned){ canvasJustPanned=false; return; }
      if (APP.graphTool === 'delete'){ runOperation('removeEdge', [id]); return; }
      APP.connectFrom = null;
      APP.selectedGraphEdge = (APP.selectedGraphEdge === id) ? null : id;
      refreshUI();
    },
    onEdgeDblClick: (id) => openEditEdgeModal(id),
    onCanvasClick: (x,y) => {
      if (canvasJustPanned){ canvasJustPanned=false; return; }
      if (APP.selectedGraphEdge){ APP.selectedGraphEdge = null; refreshUI(); }
      if (APP.graphTool !== 'add') return;
      const input = document.getElementById('graphNodeValue');
      let value = input ? input.value.trim() : '';
      if (value === '') value = String(nextGraphNodeDefault());
      runOperation('addNode', [isNaN(value)? value : Number(value), x, y]);
      if (input) input.value = nextGraphNodeDefault();
    },
    onNodeDblClick: (id) => openEditGraphModal(id)
  };
}
function buildTreeHandlers(){
  return {
    selectedId: APP.selectedTreeNode,
    onNodeClick: (id) => { APP.selectedTreeNode = (APP.selectedTreeNode===id)? null : id; refreshUI(); },
    onNodeDblClick: (id) => openEditTreeModal(id)
  };
}
function buildListHandlers(){
  return { onNodeDblClick: (id, index) => openEditListModal(id, index) };
}

function refreshUI(){
  const ws = getWS();
  const svg = document.getElementById('stage');
  const snapshot = getDisplayedSnapshot(ws);
  const highlight = getDisplayedHighlight(ws);
  const narration = getDisplayedNarration(ws);
  let handlers = null;
  if (APP.mode==='graph') handlers = buildGraphHandlers();
  if (APP.mode==='tree') handlers = buildTreeHandlers();
  if (APP.mode==='list') handlers = buildListHandlers();
  const renderFn = APP.mode==='list'?renderList : APP.mode==='tree'?renderTree : renderGraph;
  renderFn(svg, snapshot, highlight, handlers);

  document.getElementById('narrationBar').textContent = narration;
  document.getElementById('stageHint').textContent = APP.mode==='graph' ? '정점을 드래그해서 위치를 옮길 수 있어요 · 간선을 클릭하면 선택, 더블클릭하면 편집' : '';

  // 오른쪽 패널(재생 기록·도움말)은 항상 화면에 떠 있는 고정 패널입니다.
  refreshPlaybackPanel();
  if (APP.sideTab === 'help') renderHelpContent();

  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  const legendItems = APP.mode==='graph'
    ? [['#C9962B','현재 강조'],['#0F7A73','방문 완료'],['#2F4B7C','선택됨']]
    : APP.mode==='tree'
    ? [['#C9962B','현재 강조'],['#0F7A73','방문 완료'],['#2F4B7C','루트/선택']]
    : [['#C9962B','현재 강조'],['#0F7A73','head'],['#2F4B7C','tail']];
  legendItems.forEach(([color,label])=>{
    legend.appendChild(htmlEl('span', {}, `<span class="sw" style="background:${color}"></span>${label}`));
  });

  if (APP.mode==='graph'){
    const adjPanel = document.getElementById('adjPanel');
    if (adjPanel){
      const tmp = tempModelFromSnapshot('graph', snapshot);
      const showMatrix = document.getElementById('adjToggle') && document.getElementById('adjToggle').checked;
      adjPanel.textContent = showMatrix ? tmp.toAdjacencyMatrix() : tmp.toAdjacencyList();
    }
    const startSel = document.getElementById('graphStart');
    if (startSel){ const cur = startSel.value; startSel.innerHTML = graphNodeOptions(); if ([...startSel.options].some(o=>o.value===cur)) startSel.value = cur; }
  }
}

/* ---------- 재생 · 진행 기록 패널 (캔버스 오른쪽에 항상 표시되는 고정 패널) ---------- */
function renderHistoryListInto(container, ws){
  container.innerHTML = '';
  if (!ws.history.length){
    container.appendChild(htmlEl('div', {class:'history-empty'}, '아직 기록이 없습니다. 연산을 실행하면 여기에 단계별로 쌓입니다.'));
    return;
  }
  ws.history.forEach((h, i) => {
    const item = htmlEl('div', {class:'history-item'+(i===ws.cursor?' current':''), onclick:()=>seekTo(i)},
      `<span class="seq">${i+1}</span>${escapeHtml(h.narration)}`);
    container.appendChild(item);
  });
  if (ws.cursor>=0){
    const cur = container.children[ws.cursor];
    if (cur) cur.scrollIntoView({block:'nearest'});
  }
}
function refreshPlaybackPanel(){
  const ws = getWS();
  const seek = document.getElementById('seekBar');
  seek.min = 0; seek.max = ws.history.length; seek.value = ws.cursor+1;
  document.getElementById('stepCount').textContent = `${ws.cursor+1} / ${ws.history.length} 단계`;
  document.getElementById('btnStepBack').disabled = ws.cursor <= -1;
  document.getElementById('btnStepFwd').disabled = ws.cursor >= ws.history.length-1;
  renderHistoryListInto(document.getElementById('historyList'), ws);
}
// 패널은 정적 HTML로 항상 화면에 떠 있으므로, 이벤트 연결은 페이지 초기화 시 한 번만 하면 됩니다.
function initPlaybackPanel(){
  document.getElementById('btnPlay').addEventListener('click', togglePlay);
  document.getElementById('btnStepFwd').addEventListener('click', stepForward);
  document.getElementById('btnStepBack').addEventListener('click', stepBackward);
  document.getElementById('seekBar').addEventListener('input', (e)=> seekTo(parseInt(e.target.value,10)-1));
  document.getElementById('speedSel').value = String(APP.speed);
  document.getElementById('speedSel').addEventListener('change', (e)=>{ APP.speed = parseInt(e.target.value,10)||800; });
  updatePlayButton();
  refreshPlaybackPanel();

  document.getElementById('tabBtnPlayback').addEventListener('click', ()=>switchSideTab('playback'));
  document.getElementById('tabBtnHelp').addEventListener('click', ()=>switchSideTab('help'));
}
// 오른쪽 패널의 탭(재생 기록 / 도움말)을 전환합니다. 도움말 탭은 열릴 때마다
// 현재 모드(연결 리스트/트리/그래프)와 종류(단일·이중·원형, BST 등)에 맞춰 새로 그립니다.
function switchSideTab(tab){
  APP.sideTab = tab;
  document.getElementById('tabBtnPlayback').classList.toggle('active', tab==='playback');
  document.getElementById('tabBtnHelp').classList.toggle('active', tab==='help');
  document.getElementById('tabPlayback').classList.toggle('active', tab==='playback');
  document.getElementById('tabHelp').classList.toggle('active', tab==='help');
  if (tab==='help') renderHelpContent();
}
function openHelpPanel(){ switchSideTab('help'); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- 전역 드래그 리스너 (그래프 노드 이동) ---------- */
document.addEventListener('mousemove', (ev)=>{
  if (!APP.drag || APP.mode!=='graph') return;
  const dx = ev.clientX - APP.drag.startClientX, dy = ev.clientY - APP.drag.startClientY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) APP.drag.moved = true;
  if (!APP.drag.moved) return;
  const svg = document.getElementById('stage');
  const rect = svg.getBoundingClientRect();
  const ws = getWS('graph');
  const latestSnapshot = ws.history.length ? ws.history[ws.history.length-1].snapshot : ws.emptySnapshot;
  ws.model.importState(latestSnapshot);
  ws.model.moveNode(APP.drag.id, ev.clientX-rect.left, ev.clientY-rect.top);
  renderGraph(svg, ws.model.exportState(), {}, buildGraphHandlers());
});
document.addEventListener('mouseup', ()=>{
  if (!APP.drag) return;
  const d = APP.drag; APP.drag = null;
  if (d.moved && APP.mode==='graph'){
    graphJustDragged = true;
    const ws = getWS('graph');
    const node = ws.model.exportState().nodes[d.id];
    if (node) runOperation('moveNode', [d.id, node.x, node.y]);
  }
});

/* ---------- 초기화 ---------- */
function initHeaderAndFooter(){
  document.getElementById('headerEyebrow').textContent = APP_CONFIG.SCHOOL_NAME + ' · 자료구조(기본선택) · DATA STRUCTURE SIMULATION TOOL';
  document.getElementById('footerSchool').textContent = APP_CONFIG.SCHOOL_NAME;
  document.getElementById('footerCreator').textContent = APP_CONFIG.CREATOR_TEXT;
  const logo = document.getElementById('brandLogo');
  if (APP_CONFIG.LOGO_DATA_URI){
    logo.src = APP_CONFIG.LOGO_DATA_URI;
    logo.alt = APP_CONFIG.SCHOOL_NAME + ' ' + APP_CONFIG.SCHOOL_NAME_EN;
  } else {
    logo.style.display = 'none';
  }
}
function wireModalControls(){
  document.getElementById('modalCloseX').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{ if (e.target.id==='modalBackdrop') closeModal(); });
  document.addEventListener('keydown', (e)=>{ if (e.key==='Escape') closeModal(); });
}
function wireStaticControls(){
  document.getElementById('loadDiagramInput').addEventListener('change', (e)=>{ loadFile(e.target.files[0]); e.target.value=''; });
  document.getElementById('loadRecordingInput').addEventListener('change', (e)=>{ loadFile(e.target.files[0]); e.target.value=''; });
}
/* 캔버스 드래그로 화면 이동(패닝). #stage/.svg-wrap은 모드 전환/리렌더링에도 다시 만들어지지 않는
   고정 DOM이므로 한 번만 연결하면 리스트/트리/그래프 모든 모드에서 동작합니다. 노드·간선 등
   자식 요소를 직접 클릭한 경우(ev.target !== svg)는 각자의 클릭/드래그 동작이 우선하도록 건너뜁니다. */
function wireCanvasPan(){
  const svg = document.getElementById('stage');
  const wrap = document.querySelector('.svg-wrap');
  let pan = null;
  svg.addEventListener('mousedown', (ev)=>{
    canvasJustPanned = false; // 새 상호작용이 시작되면 이전에 소비되지 않은 플래그(예: 모드 전환)를 정리
    if (ev.button !== 0) return;
    if (ev.target !== svg) return; // 노드/간선 등 도형 위에서는 패닝을 시작하지 않음
    pan = { startX: ev.clientX, startY: ev.clientY, startLeft: wrap.scrollLeft, startTop: wrap.scrollTop, moved:false };
  });
  document.addEventListener('mousemove', (ev)=>{
    if (!pan) return;
    const dx = ev.clientX - pan.startX, dy = ev.clientY - pan.startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) pan.moved = true;
    if (!pan.moved) return;
    svg.classList.add('panning');
    wrap.scrollLeft = pan.startLeft - dx;
    wrap.scrollTop = pan.startTop - dy;
  });
  document.addEventListener('mouseup', ()=>{
    if (!pan) return;
    if (pan.moved) canvasJustPanned = true; // 패닝 직후 발생하는 click을 한 번 무시(그래프 정점 추가 등 오작동 방지)
    pan = null;
    svg.classList.remove('panning');
  });
}
function init(){
  initHeaderAndFooter();
  buildModeTabs();
  wireStaticControls();
  wireModalControls();
  wireCanvasPan();
  // switchMode보다 먼저 호출하면 안 됩니다: 내부에서 getWS()를 건드려 APP.ws[mode]를
  // 미리 만들어버리면, switchMode의 "이미 이 모드임" 가드가 첫 로드에서 잘못 참이 되어
  // buildToolbar()가 아예 실행되지 않고 도구모음이 빈 채로 남는 문제가 있었습니다.
  switchMode('list', true);
  initPlaybackPanel();
  window.addEventListener('resize', ()=>refreshUI());
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
